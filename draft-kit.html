<meta charset="utf-8">
<title>Draft Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">

<style>
/* ============================================================
   TOKENS — light is the bare :root; dark redefined in both the
   media query (OS setting) and the [data-theme] stamp (toggle).
   Every color below is a token; nothing is declared only inside
   a themed block.
   ============================================================ */
:root {
  color-scheme: light;

  --bg:            #f2efe9;
  --surface:       #ffffff;
  --surface-2:     #f8f6f1;
  --surface-3:     #edeae3;
  --line:          #ddd8ce;
  --line-soft:     #e8e4db;
  --line-strong:   #c2bbad;

  --ink:           #14181b;
  --ink-2:         #4e555c;
  --ink-3:         #838b93;

  --accent:        #f0a51e;
  --accent-ink:    #17120a;
  --accent-text:   #8a5900;
  --accent-soft:   #fbeccb;

  --pos-QB:  #6420aa;
  --pos-RB:  #eb476b;
  --pos-WR:  #0d99b3;
  --pos-TE:  #415a00;
  --pos-K:   #63696f;
  --pos-DST: #4a5560;
  --pos-ink: #ffffff;

  --good:          #0a7d0a;
  --warn:          #b07600;
  --crit:          #c1342f;
  --good-soft:     #e2f2e2;
  --warn-soft:     #fbeed0;
  --crit-soft:     #f8e2e1;

  --shadow:        0 1px 2px rgba(20,24,27,.07), 0 6px 18px rgba(20,24,27,.05);
  --shadow-lift:   0 2px 6px rgba(20,24,27,.10), 0 14px 34px rgba(20,24,27,.10);

  --r-sm: 3px;  --r-md: 5px;  --r-lg: 8px;

  --sans: "IBM Plex Sans Condensed", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --display: "Archivo", "Segoe UI", system-ui, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:          #0e1417;
    --surface:     #141b1f;
    --surface-2:   #1a2429;
    --surface-3:   #223037;
    --line:        #263238;
    --line-soft:   #1c262b;
    --line-strong: #3a4c55;
    --ink:         #eef3f5;
    --ink-2:       #a3b1b8;
    --ink-3:       #71828b;
    --accent:      #f0a51e;
    --accent-ink:  #14100a;
    --accent-text: #f2b446;
    --accent-soft: #33270e;
    --pos-QB:  #804fc3;
    --pos-RB:  #e85b75;
    --pos-WR:  #0fa3bf;
    --pos-TE:  #6f9409;
    --pos-K:   #7e888f;
    --pos-DST: #61727d;
    --pos-ink: #0b1113;
    --good:      #35bb46;
    --warn:      #f0b429;
    --crit:      #ee5f5b;
    --good-soft: #16301b;
    --warn-soft: #33280d;
    --crit-soft: #3a1e1e;
    --shadow:      0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
    --shadow-lift: 0 2px 6px rgba(0,0,0,.55), 0 14px 34px rgba(0,0,0,.45);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:          #0e1417;
  --surface:     #141b1f;
  --surface-2:   #1a2429;
  --surface-3:   #223037;
  --line:        #263238;
  --line-soft:   #1c262b;
  --line-strong: #3a4c55;
  --ink:         #eef3f5;
  --ink-2:       #a3b1b8;
  --ink-3:       #71828b;
  --accent:      #f0a51e;
  --accent-ink:  #14100a;
  --accent-text: #f2b446;
  --accent-soft: #33270e;
  --pos-QB:  #804fc3;
  --pos-RB:  #e85b75;
  --pos-WR:  #0fa3bf;
  --pos-TE:  #6f9409;
  --pos-K:   #7e888f;
  --pos-DST: #61727d;
  --pos-ink: #0b1113;
  --good:      #35bb46;
  --warn:      #f0b429;
  --crit:      #ee5f5b;
  --good-soft: #16301b;
  --warn-soft: #33280d;
  --crit-soft: #3a1e1e;
  --shadow:      0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
  --shadow-lift: 0 2px 6px rgba(0,0,0,.55), 0 14px 34px rgba(0,0,0,.45);
}

/* ============================================================
   BASE
   ============================================================ */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
}

button, input, select { font: inherit; color: inherit; }
input[type="range"], input[type="checkbox"] { accent-color: var(--accent); }
button { cursor: pointer; border: none; background: none; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100dvh;
  max-width: 1600px;
  margin: 0 auto;
  background: var(--bg);
}

/* ============================================================
   STATUS BAR — the draft's vital signs, always visible
   ============================================================ */
.status {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: stretch;
  gap: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: relative;
}
.status::after {
  content: "";
  position: absolute; inset-inline: 0; bottom: -1px; height: 2px;
  background: var(--line);
  transition: background .2s;
}
.status[data-mine="1"]::after { background: var(--accent); }

/* Hero number: picks until your turn */
.clock {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-right: 1px solid var(--line);
  min-width: 132px;
}
.clock-n {
  font-family: var(--display);
  font-weight: 900;
  font-size: 40px;
  line-height: .84;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.status[data-mine="1"] .clock-n { color: var(--accent-text); }
.clock-lab { font-size: 11px; line-height: 1.15; color: var(--ink-3); max-width: 62px; }
.clock-lab b { display: block; color: var(--ink-2); font-weight: 600; }

.status[data-mine="1"] .clock {
  background: var(--accent);
}
.status[data-mine="1"] .clock-n,
.status[data-mine="1"] .clock-lab,
.status[data-mine="1"] .clock-lab b { color: var(--accent-ink); }

.status-mid {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
  padding: 9px 14px;
  min-width: 0;
}
.status-line1 {
  display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
}
.rp {
  font-family: var(--mono);
  font-size: 17px; font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}
.onclock {
  font-size: 13px; font-weight: 600; color: var(--ink-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.status-line2 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

.status-act { display: flex; align-items: stretch; border-left: 1px solid var(--line); }
.sbtn {
  padding: 0 15px;
  font-size: 12px; font-weight: 600;
  letter-spacing: .05em; text-transform: uppercase;
  color: var(--ink-2);
  border-right: 1px solid var(--line);
  transition: background .12s, color .12s;
  font-family: var(--mono);
}
.sbtn:last-child { border-right: none; }
.sbtn:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
.sbtn:disabled { color: var(--ink-3); opacity: .45; cursor: default; }

/* Alert chips — state in form as well as color */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 11px; font-weight: 600;
  border: 1px solid transparent;
  white-space: nowrap;
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.chip-warn { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.chip-warn .dot { background: var(--warn); }
.chip-crit { background: var(--crit-soft); color: var(--crit); border-color: color-mix(in srgb, var(--crit) 35%, transparent); }
.chip-crit .dot { background: var(--crit); }
.chip-good { background: var(--good-soft); color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, transparent); }
.chip-good .dot { background: var(--good); }
.chip-mute { background: var(--surface-2); color: var(--ink-2); border-color: var(--line); }
.chip-mute .dot { background: var(--ink-3); }

/* ============================================================
   MAIN / PANES
   ============================================================ */
.main { overflow: hidden; min-height: 0; }
.pane { display: none; height: 100%; overflow-y: auto; overscroll-behavior: contain; }
.pane.on { display: block; }
.pane-split { display: none; height: 100%; min-height: 0; }
.pane-split.on { display: grid; grid-template-columns: 1fr; }
.col { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
.col-side { display: none; border-left: 1px solid var(--line); background: var(--surface-2); }

@media (min-width: 900px) {
  .pane-split.on { grid-template-columns: minmax(0,1fr) 340px; }
  .col-side { display: block; }
}

.wrap { padding: 14px; max-width: 760px; margin: 0 auto; }
.wrap-wide { padding: 14px; }

/* ============================================================
   SEARCH + FILTERS
   ============================================================ */
.toolbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 9px 10px 8px;
  display: flex; flex-direction: column; gap: 8px;
}
.searchrow { display: flex; gap: 7px; }
.search {
  flex: 1; min-width: 0;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 9px 11px;
  font-size: 16px; /* >=16px stops iOS/Android zoom-on-focus */
  color: var(--ink);
}
.search::placeholder { color: var(--ink-3); }
.search:focus { outline: none; border-color: var(--accent); background: var(--surface); }

.sortsel {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 0 8px;
  font-size: 13px;
  max-width: 138px;
}

.srcrow { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; align-items: center; }
.srcrow::-webkit-scrollbar { display: none; }
.srcrow .eyebrow { flex: none; padding-right: 2px; }
.sbtn-src {
  flex: none; padding: 5px 10px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--surface-2);
  font-size: 11.5px; font-weight: 600; color: var(--ink-2);
  max-width: 168px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sbtn-src[aria-pressed="true"] {
  background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text);
}

.filters { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
.filters::-webkit-scrollbar { display: none; }
.fbtn {
  flex: none;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 12px; font-weight: 600;
  font-family: var(--mono); letter-spacing: .04em;
  color: var(--ink-2);
  transition: background .12s, color .12s, border-color .12s;
}
.fbtn[aria-pressed="true"] {
  background: var(--ink); color: var(--surface); border-color: var(--ink);
}
.fbtn[data-pos][aria-pressed="true"] { background: var(--p); border-color: var(--p); color: var(--pos-ink); }

/* ============================================================
   PLAYER ROWS — the thing you actually stare at
   ============================================================ */
.verdict {
  display: flex; align-items: center; gap: 9px;
  width: 100%; text-align: left;
  padding: 9px 12px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
}
.verdict-pos {
  font-family: var(--mono); font-size: 12px; font-weight: 600;
  padding: 3px 8px; border-radius: var(--r-sm);
  background: var(--p); color: var(--pos-ink); flex: none;
}
.verdict-t { font-size: 13.5px; min-width: 0; }
.verdict-t b { font-weight: 600; }
.verdict-t span { color: var(--ink-3); }
.verdict-n {
  margin-left: auto; flex: none;
  font-family: var(--mono); font-size: 13px; font-weight: 600;
  color: var(--good); font-variant-numeric: tabular-nums;
}

.list { padding-bottom: 12px; }

.tierbreak {
  display: flex; align-items: center; gap: 9px;
  padding: 15px 12px 6px;
  background: var(--bg);
}
.tierbreak .ln { flex: 1; height: 1px; background: var(--line-strong); }

.row {
  display: grid;
  grid-template-columns: 42px 40px minmax(0,1fr) auto;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 9px 12px;
  min-height: 54px; /* thumb-sized */
  border-bottom: 1px solid var(--line-soft);
  /* transparent on every row so tagged ones don't shift the text 2px */
  border-left: 2px solid transparent;
  background: var(--surface);
  text-align: left;
  transition: background .1s;
}
.row:active { background: var(--surface-3); }
.row.queued { background: linear-gradient(90deg, var(--accent-soft), var(--surface) 55%); }
.row[data-note="target"] { border-left-color: var(--good); }
.row[data-note="avoid"]  { border-left-color: var(--crit); }
.row[data-note="watch"]  { border-left-color: var(--warn); }
/* two sources reaching opposite verdicts is its own thing worth seeing */
.row[data-note="split"]  { border-left-color: var(--warn); }

.rk {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 13px; font-weight: 500; color: var(--ink-3);
  text-align: right;
}
.rk small { display: block; font-size: 10px; color: var(--ink-3); opacity: .8; }

.pos {
  font-family: var(--mono);
  font-size: 11px; font-weight: 600; letter-spacing: .02em;
  text-align: center;
  padding: 3px 0;
  border-radius: var(--r-sm);
  background: var(--p);
  color: var(--pos-ink);
}

.who { min-width: 0; }
.nm {
  font-size: 15.5px; font-weight: 600; letter-spacing: -.005em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.meta {
  display: flex; gap: 7px; align-items: center;
  font-size: 11.5px; color: var(--ink-3);
  font-family: var(--mono);
  white-space: nowrap; overflow: hidden;
}
.meta .sep { opacity: .4; }

.rt { display: flex; align-items: center; gap: 8px; }

/* Survival meter: direct-labelled, never color alone */
.surv { width: 46px; flex: none; }
.surv-n {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 12px; font-weight: 600; text-align: right;
  color: var(--ink-2);
}
.surv-bar {
  height: 3px; margin-top: 3px; border-radius: 2px;
  background: var(--surface-3); overflow: hidden;
}
.surv-fill { height: 100%; border-radius: 2px; background: var(--ink-3); }
.surv[data-band="hi"]  .surv-fill { background: var(--good); }
.surv[data-band="mid"] .surv-fill { background: var(--warn); }
.surv[data-band="lo"]  .surv-fill { background: var(--crit); }
.surv[data-band="hi"]  .surv-n { color: var(--good); }
.surv[data-band="mid"] .surv-n { color: var(--warn); }
.surv[data-band="lo"]  .surv-n { color: var(--crit); }

.val {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 12px; font-weight: 600;
  min-width: 34px; text-align: right;
}
.val.up { color: var(--good); }
.val.down { color: var(--ink-3); }

.qbtn {
  flex: none; width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  color: var(--ink-3);
  font-size: 15px;
}
.qbtn[aria-pressed="true"] { color: var(--accent-text); }
.qbtn:hover { background: var(--surface-3); }

.empty { padding: 44px 20px; text-align: center; color: var(--ink-3); font-size: 14px; }

/* ============================================================
   CARDS / SIDE PANEL
   ============================================================ */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  margin-bottom: 12px;
  overflow: hidden;
}
.card-h {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 12px 8px;
  border-bottom: 1px solid var(--line-soft);
}
.card-b { padding: 11px 12px; }
.card-b.flush { padding: 0; }

/* Scarcity meters — one row per position, count direct-labelled */
.scar { display: flex; flex-direction: column; gap: 8px; }
.scar-row { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 9px; }
.scar-track { height: 7px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.scar-fill { height: 100%; border-radius: 4px; background: var(--p); }
.scar-n { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.scar-n b { color: var(--ink); font-weight: 600; }

/* Roster slots */
.slots { display: flex; flex-direction: column; }
.slot {
  display: grid; grid-template-columns: 46px minmax(0,1fr) auto;
  align-items: center; gap: 9px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line-soft);
}
.slot:last-child { border-bottom: none; }
.slot-lab {
  font-family: var(--mono); font-size: 10.5px; font-weight: 600;
  letter-spacing: .08em; color: var(--ink-3);
}
.slot.filled .slot-lab { color: var(--ink-2); }
.slot-nm { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot.open .slot-nm { color: var(--ink-3); font-weight: 400; font-style: italic; }
.slot-bye { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.slot-bye.clash { color: var(--crit); font-weight: 600; }

/* ---- My Team: stat tiles ---- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px,1fr)); gap: 9px; margin-bottom: 12px; }
.tile {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 11px 12px 10px;
}
.tile-n {
  font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1;
  letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--ink);
}
.tile-n.sm { font-size: 21px; }
.tile-l {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 6px;
}
.tile-c { font-size: 12px; margin-top: 4px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tile-c.up { color: var(--good); } .tile-c.down { color: var(--crit); }

/* ---- positional strength: diverging from a centre line ----
   The bar's colour says which position; which side of the line it sits on
   says ahead or behind. Every bar carries its own number, so nothing is
   read from colour alone. */
.pbars { display: flex; flex-direction: column; gap: 9px; }
.pbar-row { display: grid; grid-template-columns: 34px 1fr 52px; gap: 9px; align-items: center; }
.pbar-track { position: relative; height: 18px; }
.pbar-track::before {
  content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px;
  width: 1px; background: var(--line-strong);
}
.pbar-fill { position: absolute; top: 3px; height: 12px; background: var(--p); border-radius: 2px; min-width: 2px; }
.pbar-n {
  font-family: var(--mono); font-size: 12px; font-weight: 600;
  text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2);
}
.pbar-n.up { color: var(--good); } .pbar-n.down { color: var(--crit); }
.pbar-scale {
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 10px; color: var(--ink-3);
  padding: 2px 61px 0 43px;
}

/* ---- bye weeks as columns ---- */
.byecols { display: flex; gap: 4px; align-items: flex-end; }
.byecol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.byecol-track {
  width: 100%; height: 44px; display: flex; flex-direction: column-reverse;
  background: var(--surface-2); border-radius: var(--r-sm); overflow: hidden;
}
.byecol-seg { width: 100%; background: var(--p); border-top: 2px solid var(--surface); }
.byecol-seg:first-child { border-top: none; }
.byecol-w { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
.byecol.hot .byecol-w { color: var(--crit); font-weight: 600; }
.byecol-n { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--ink-2); }
.byecol.empty-col .byecol-n { color: var(--ink-3); opacity: .45; }

<script>
"use strict";
/* ================================================================
   DRAFT ROOM — an offline draft companion.
   Everything lives in this one file: no network, no server.
   ================================================================ */

const POS = ["QB","RB","WR","TE","K","DST"];
const SKILL = ["QB","RB","WR","TE"];
const KEY = "draftroom.v1";

/* ---------------- storage (must survive a hostile localStorage) ---------------- */
function save() {
  // S.players is derived from S.sources, and view() decorates it with
  // per-render fields. Storing it would double the payload and stale it.
  try {
    localStorage.setItem(KEY, JSON.stringify({ ...S, players: undefined }));
  } catch (e) { /* private mode, quota, blocked */ }
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

/* ---------------- state ---------------- */
const defaults = () => ({
  cfg: {
    teams: 12, rounds: 16, mySlot: 5, trr: false, vol: 0.20,
    awake: true, rehearse: false,
    // Off by default: a file's own points column already reflects SOME
    // scoring, and quietly substituting a different one would be worse than
    // leaving it alone. Switch it on once you've entered your league's rules.
    scoring: { on: false, ppr: 1, passTd: 4, passYd: 25, intp: -2,
               rushYd: 10, rushTd: 6, recYd: 10, recTd: 6 },
    slots: { QB:1, RB:2, WR:3, TE:1, FLEX:1, K:1, DST:1, BN:6 },
    names: [],
  },
  sources: [],        // [{ id, name, players }] - every ranking set you've loaded
  activeSource: null, // a source id, or CONSENSUS
  players: [],        // derived: the active set. Never saved; rebuilt on load.
  picks: [],          // { pid, team, overall } - pid is a stable cross-source key
  queue: [],          // pids
  notes: [],          // { pid, pol, source, snippet } - what the articles say
  offBoard: [],       // players the room drafted that your file has never heard of
  status: {},         // pid -> injury or suspension code, kept off the ranking sets
  isDemo: true,
  theme: null,
  ui: { tab: "board", filter: "ALL", sort: "rank", q: "", openNotes: [] },
});

let S = load() || defaults();
// forward-compat: fill in anything a older save is missing
S = Object.assign(defaults(), S);
S.cfg = Object.assign(defaults().cfg, S.cfg);
S.ui  = Object.assign(defaults().ui, S.ui);

/* ---------------- keep the screen on ----------------
   Three hours at a table with a tablet that sleeps every minute is the
   difference between a tool and a nuisance. The lock is dropped whenever the
   page is hidden, so it has to be taken again on the way back. */
let wakeLock = null;
async function keepAwake(want) {
  try {
    if (want && S.cfg.awake && "wakeLock" in navigator && document.visibilityState === "visible") {
      if (wakeLock) return;
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!want && wakeLock) {
      await wakeLock.release();
      wakeLock = null;
    }
  } catch (e) { wakeLock = null; }   // unsupported, denied, or not visible
}
const wakeSupported = () => "wakeLock" in navigator;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake(true);
});

/* ---------------- theme ---------------- */
function applyTheme() {
  if (S.theme) document.documentElement.setAttribute("data-theme", S.theme);
  else document.documentElement.removeAttribute("data-theme");
}
// A draft room is dim and the tablet is on battery: dark is the sensible
// default, but any explicit choice wins and persists.
if (S.theme === null && load() === null) S.theme = "dark";
applyTheme();

/* ================================================================
   CSV — forgiving by design. Real exports have quoted commas,
   BOMs, blank trailing rows, and "RB4" in the position column.
   ================================================================ */
function parseCSV(text) {
  text = text.replace(/^﻿/, "").replace(/\r\n?/g, "\n");
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  row.push(cell); rows.push(row);
  return rows.filter(r => r.some(v => String(v).trim() !== ""));
}

const HEADER_HINTS = {
  name: ["player name","playername","player","name","full name"],
  pos:  ["pos","position"],
  team: ["team","tm","nfl team"],
  rank: ["rk","rank","overall","ovr","#","ecr","overall rank"],
  tier: ["tier","tiers"],
  adp:  ["adp","avg","average","avg pick","adp ppr","consensus adp"],
  bye:  ["bye","bye week","byeweek"],
  status: ["injury","injury status","status","inj","designation","game status"],
  proj: ["pts","proj","fpts","points","projected points","proj pts","fantasy pts","fantasy points"],
};

// Real NFL abbreviations, so a name suffix ("Mahomes II") is never mistaken
// for a team when a file has no team column. Aliases fold the variants
// different sites use for the same club.
const TEAM_ALIAS = {
  JAC:"JAX", WSH:"WAS", WFT:"WAS", LA:"LAR", STL:"LAR", SD:"LAC", SDG:"LAC",
  OAK:"LV", LVR:"LV", ARZ:"ARI", BLT:"BAL", CLV:"CLE", HST:"HOU", TAM:"TB",
  NWE:"NE", NOR:"NO", SFO:"SF", GNB:"GB", KAN:"KC", TEN:"TEN", NYG:"NYG",
};
const NFL_TEAMS = new Set(("ARI ATL BAL BUF CAR CHI CIN CLE DAL DEN DET GB HOU IND JAX KC LAC LAR "
  + "LV MIA MIN NE NO NYG NYJ PHI PIT SEA SF TB TEN WAS").split(" "));
const normTeam = t => {
  const u = String(t).toUpperCase().replace(/[^A-Z]/g, "");
  return TEAM_ALIAS[u] || u;
};

function guessMap(header) {
  const norm = header.map(h => String(h).trim().toLowerCase().replace(/[._]/g," ").replace(/\s+/g," "));
  const map = {};
  for (const [field, hints] of Object.entries(HEADER_HINTS)) {
    let best = -1, bestScore = 0;
    norm.forEach((h, i) => {
      if (!h) return;
      let sc = 0;
      if (hints.includes(h)) sc = 3;
      else if (hints.some(x => h === x + "s")) sc = 3;
      else if (hints.some(x => h.startsWith(x))) sc = 2;
      else if (hints.some(x => h.includes(x))) sc = 1;
      // never let "adp" steal the rank slot, or "bye week" steal "team"
      if (field === "rank" && /adp|avg/.test(h)) sc = 0;
      if (field === "team" && /bye/.test(h)) sc = 0;
      // "(Stats)" columns are last season's actuals, never this season's projection
      if (h.includes("stats")) sc = 0;
      if (sc > bestScore) { bestScore = sc; best = i; }
    });
    map[field] = bestScore > 0 ? best : -1;
  }
  return map;
}

/* A player's identity has to survive being spelled differently in two files:
   "Travis Etienne Jr." and "Travis Etienne" are one player, and picks logged
   under one ranking set must still read as drafted after switching to another.
   Team defenses are keyed on the club, since their *names* vary the most
   ("Houston Texans" / "Texans" / "Houston D/ST"). */
const NAME_SUFFIX = /\s+(jr|sr|ii|iii|iv|v)$/;
function playerKey(name, pos, team) {
  if (pos === "DST") return "dst|" + normTeam(team);
  let n = String(name).toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9 ]/g, " ")
    .replace(/\s+/g, " ").trim();
  let prev;
  do { prev = n; n = n.replace(NAME_SUFFIX, "").trim(); } while (n !== prev);
  return n + "|" + pos;
}

/* The raw stat columns an export carries alongside its points total. With
   these, the points can be recomputed under YOUR league's rules instead of
   whatever the site assumed - which for a 6-point passing league is a fifty
   to seventy point swing on every starting quarterback. */
const STAT_HINTS = {
  passYds: ["pass yds", "passing yards", "pass yards", "py"],
  passTds: ["pass td", "passing td", "pass tds", "ptd"],
  ints:    ["int", "interceptions", "ints"],
  rushYds: ["rush yds", "rushing yards", "rush yards"],
  rushTds: ["rush td", "rushing td", "rush tds"],
  recs:    ["rec", "receptions", "catches"],
  recYds:  ["rec yds", "receiving yards", "rec yards"],
  recTds:  ["rec td", "receiving td", "rec tds"],
};

function guessStats(header) {
  const norm = header.map(h => String(h).trim().toLowerCase()
    .replace(/[._]/g, " ").replace(/\s+/g, " "));
  const map = {};
  for (const [field, hints] of Object.entries(STAT_HINTS)) {
    let best = -1, bestScore = 0;
    norm.forEach((h, i) => {
      if (!h) return;
      // last season's actuals are not this season's projection
      if (h.includes("stats")) return;
      let sc = 0;
      if (hints.includes(h)) sc = 3;
      else if (hints.some(x => h.startsWith(x + " "))) sc = 2;
      else if (hints.some(x => h.includes(x))) sc = 1;
      if (sc > bestScore) { bestScore = sc; best = i; }
    });
    map[field] = bestScore >= 2 ? best : -1;   // a loose substring is not enough
  }
  return map;
}

const cleanPos = v => {
  const s = String(v).toUpperCase().replace(/[^A-Z]/g, "");
  if (s.startsWith("DST") || s.startsWith("DEF") || s === "D") return "DST";
  if (s.startsWith("PK") || s === "K") return "K";
  return POS.find(p => s.startsWith(p)) || s.slice(0,3) || "?";
};
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : null; };

function buildPlayers(rows, map, statMap) {
  const body = rows.slice(1);
  const out = [];
  const hasAdpCol = map.adp >= 0;
  const sm = statMap || guessStats(rows[0]);
  const statFields = Object.keys(STAT_HINTS).filter(k => sm[k] >= 0);
  body.forEach((r, i) => {
    const get = f => map[f] >= 0 && map[f] < r.length ? String(r[map[f]]).trim() : "";
    let name = get("name");
    if (!name) return;
    // Some exports append the team to the name: "Ja'Marr Chase CIN". Only
    // strip a trailing token that is actually an NFL club — otherwise
    // "Patrick Mahomes II" loses its suffix and gains a team called "II".
    let team = get("team");
    if (!team) {
      const m = name.match(/\s+\(?([A-Za-z]{2,3})\)?$/);
      if (m && NFL_TEAMS.has(normTeam(m[1]))) { team = m[1]; name = name.slice(0, m.index).trim(); }
    }
    // Some exports hang the designation off the name: "Player Name (IR)"
    let nameStatus = null;
    const tag = name.match(/[\s(\[-]+(Q|D|O|IR|PUP|SUS|NFI)[\)\]]?\s*$/i);
    if (tag) { nameStatus = readStatus(tag[1]); name = name.slice(0, tag.index).trim(); }
    const pos = cleanPos(get("pos"));
    // A blank or zero ADP means "no ADP data" (RotoBaller writes 0), not
    // "goes first overall". Keeping the 0 would put undrafted players at the
    // top of an ADP sort and tell the survival model they are already gone.
    let adp = num(get("adp"));
    if (adp != null && adp <= 0) adp = null;
    let stats = null;
    if (statFields.length >= 4) {
      stats = {};
      let any = false;
      statFields.forEach(k => {
        const v = num(String(r[sm[k]] ?? "").trim());
        stats[k] = v == null ? 0 : v;
        if (v) any = true;
      });
      if (!any) stats = null;          // a row with no numbers is not a projection
    }
    const proj = num(get("proj"));
    out.push({
      name,
      team: normTeam(team) || "—",
      pos,
      rank: num(get("rank")) ?? (i + 1),
      tier: num(get("tier")),
      adp,
      bye:  num(get("bye")),
      proj,
      projFile: proj,                   // what the file said, kept so this is reversible
      stats,
      statsChecked: true,               // parsed by a build that looks for stat columns
      _status: readStatus(get("status")) || nameStatus,
    });
  });
  out.sort((a, b) => a.rank - b.rank);
  out.forEach((p, i) => { p.rank = i + 1; });
  // No ADP column at all -> rank is a fair stand-in for the whole list.
  // A column that exists but is blank for one player is a real gap: leave it
  // null rather than inventing a number the file never claimed.
  // With no ADP column the rank stands in for it, but that is your own list
  // talking - not the market - so it can't be evidence of disagreement.
  out.forEach(p => { p.adpReal = hasAdpCol; });
  if (!hasAdpCol) out.forEach(p => { p.adp = p.rank; });
  assignKeys(out);
  if (out.every(p => p.tier == null) || !tiersLookPositional(out)) autoTier(out);
  posRanks(out);
  return out;
}

function assignKeys(list) {
  const seen = new Map();
  list.forEach(p => {
    const base = playerKey(p.name, p.pos, p.team);
    const n = (seen.get(base) || 0) + 1;
    seen.set(base, n);
    p.id = n === 1 ? base : base + "#" + n;   // same name+pos twice in one file
  });
}

/* An export's tier column may be overall ("tier 6 of the whole board") or
   positional ("the 6th tier of RBs"). Every tier reading here is per position,
   so an overall column has to be re-derived or every position reads as a cliff. */
function tiersLookPositional(list) {
  const byTier = {};
  list.forEach(p => {
    if (p.tier == null) return;
    (byTier[p.tier] = byTier[p.tier] || new Set()).add(p.pos);
  });
  const groups = Object.values(byTier);
  if (groups.length < 2) return false;
  const mixed = groups.filter(g => g.size > 1).length;
  return mixed / groups.length < 0.34;
}

/* Tiers from ADP gaps, cut at the biggest drop-offs.

   The gaps have to be measured on a LOG scale. ADP spreads out as it grows -
   consecutive WRs are 1-3 picks apart at the top of the board and 30-90 apart
   in the last rounds - so ranking raw gaps puts every cut in the dead zone and
   leaves the top, where tiers actually decide picks, as one undivided blob
   (measured: 65 WRs in tier 1 on a real 400-player export). A ratio treats
   "4.5 to 6.1" as the real cliff it is and "250 to 258" as the noise it is.

   Aim for tiers of ~5, then split any tier that still runs long, so no tier
   is too big to be a decision. */
function autoTier(list) {
  const MAX_TIER = 8;
  // Shift before taking the log: a raw ratio is savage at the very top
  // (ADP 1.2 -> 2.0 is a 51% jump) and would give the first two picks a tier
  // each. Swept against a real 400-player board, 8 is where singleton tiers
  // disappear without the top of each position collapsing into one blob.
  const SHIFT = 8;
  POS.forEach(pos => {
    const grp = list.filter(p => p.pos === pos).sort((a,b) => a.rank - b.rank);
    if (grp.length < 3) { grp.forEach(p => p.tier = 1); return; }
    const at = p => Math.max(1, p.adp != null ? p.adp : p.rank) + SHIFT;
    const gaps = [];
    for (let i = 1; i < grp.length; i++) gaps.push({ i, g: Math.log(at(grp[i])) - Math.log(at(grp[i-1])) });
    const k = Math.max(2, Math.round(grp.length / 5));
    const cuts = new Set(gaps.slice().sort((a,b) => b.g - a.g).slice(0, k - 1).map(x => x.i));
    // Long runs with no meaningful gap still need breaking somewhere.
    let run = 0;
    for (let i = 0; i < grp.length; i++) {
      run = cuts.has(i) ? 1 : run + 1;
      if (run > MAX_TIER) { cuts.add(i); run = 1; }
    }
    let t = 1;
    grp.forEach((p, i) => { if (cuts.has(i)) t++; p.tier = t; });
  });
}

function posRanks(list) {
  const c = {};
  [...list].sort((a,b) => a.rank - b.rank).forEach(p => {
    c[p.pos] = (c[p.pos] || 0) + 1;
    p.pr = c[p.pos];              // your list's order within the position
  });
  // The market's order within the position, so "your RB14" can be set against
  // "the room's RB9". Comparing overall rank to overall ADP instead would just
  // measure how far down a list chooses to bury kickers and defenses.
  const d = {};
  [...list].filter(p => p.adp != null).sort((a,b) => a.adp - b.adp).forEach(p => {
    d[p.pos] = (d[p.pos] || 0) + 1;
    p.apr = d[p.pos];
  });
}

/* ================================================================
   RANKING SETS
   Several lists can be loaded at once. Picks are keyed on the player,
   not on a row in one file, so switching sets mid-draft keeps every
   pick — and CONSENSUS averages the sets that are loaded.
   ================================================================ */
const CONSENSUS = "__consensus__";

const sourceById = id => S.sources.find(x => x.id === id) || null;

function seedStatus(players) {
  players.forEach(p => {
    if (p._status && !S.status[p.id]) S.status[p.id] = p._status;
  });
}

function addSource(name, players) {
  seedStatus(players);
  const id = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  S.sources.push({ id, name: name || `List ${S.sources.length + 1}`, players });
  S.activeSource = id;
  S.isDemo = false;
  refreshActive();
  return id;
}

function removeSource(id) {
  S.sources = S.sources.filter(x => x.id !== id);
  if (S.activeSource === id || !S.sources.length)
    S.activeSource = S.sources.length ? (S.sources.length > 1 ? CONSENSUS : S.sources[0].id) : null;
  refreshActive();
}

/* Average rank across every set a player appears in. A player missing from a
   set isn't penalised for it - but coverage is reported, because "3rd overall
   on the one list that has him" is a different claim than "3rd on all three". */
function buildConsensus() {
  const acc = new Map();
  S.sources.forEach(src => {
    src.players.forEach(p => {
      let e = acc.get(p.id);
      if (!e) { e = { ...p, ranks: [], adps: [], projs: [] }; acc.set(p.id, e); }
      e.ranks.push(p.rank);
      if (p.adp  != null) e.adps.push(p.adp);
      if (p.proj != null) e.projs.push(p.proj);
      if (p.adpReal) e.adpReal = true;
      if (!e.bye  && p.bye)  e.bye  = p.bye;
      if ((!e.team || e.team === "—") && p.team) e.team = p.team;
    });
  });
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const out = [...acc.values()].map(e => ({
    ...e,
    rank:   mean(e.ranks),
    adp:    mean(e.adps),
    proj:   e.projs.length ? Math.round(mean(e.projs)) : null,
    spread: e.ranks.length > 1 ? Math.round(Math.max(...e.ranks) - Math.min(...e.ranks)) : null,
    nIn:    e.ranks.length,
    tier:   null,
  }));
  out.sort((a, b) => a.rank - b.rank);
  out.forEach((p, i) => { p.rank = i + 1; });
  autoTier(out);
  posRanks(out);
  return out;
}

/* Short enough to sit on one line at every column width - mixed one- and
   two-line labels pushed the inputs to different heights and the row read as
   broken. Grouped pass / rush / receive so the pairs land together. */
const SCORING_FIELDS = [
  ["ppr",     "Per catch",     "1 for full PPR, 0.5 for half, 0 for standard"],
  ["intp",    "Interception",  "usually -2, sometimes -1"],
  ["passTd",  "Pass TD",       "6 in a lot of leagues, 4 by default"],
  ["passYd",  "Pass yds / pt", "25 by default — one point per 25 passing yards"],
  ["rushTd",  "Rush TD",       "6 almost everywhere"],
  ["rushYd",  "Rush yds / pt", "10 by default"],
  ["recTd",   "Rec TD",        "6 almost everywhere"],
  ["recYd",   "Rec yds / pt",  "10 by default"],
];

/* One tap instead of eight numeric fields on a touch keyboard. "Match this
   file" is the diagnostic: if it reports no change, your export was built on
   those rules. */
const SCORING_PRESETS = [
  { id: "espn", label: "My league (ESPN)", why: "6-point passing TDs, a point per 20 passing yards",
    set: { ppr: 1, intp: -2, passTd: 6, passYd: 20, rushTd: 6, rushYd: 10, recTd: 6, recYd: 10 } },
  { id: "file", label: "Match this file", why: "4-point passing TDs, a point per 25 passing yards",
    set: { ppr: 1, intp: -2, passTd: 4, passYd: 25, rushTd: 6, rushYd: 10, recTd: 6, recYd: 10 } },
];
const presetMatches = pre =>
  Object.keys(pre.set).every(k => Number(S.cfg.scoring[k]) === pre.set[k]);

/* How far the current settings are from the file's own numbers. Saying
   "reproduces the file exactly" tells you what the file assumed; listing what
   moves tells you what your rules change. Both beat a worked example that
   reads 388 -> 388. */
function scoringDelta() {
  const sc = { ...S.cfg.scoring, on: true };
  let same = 0, moved = [];
  S.sources.forEach(src => src.players.forEach(p => {
    if (!p.stats || !usableStats(p) || p.projFile == null) return;
    const v = Math.round(scoreFromStats(p.stats, sc));
    if (Math.abs(v - p.projFile) <= 2) same++;
    else moved.push({ name: p.name, pos: p.pos, rank: p.rank, from: p.projFile, to: v });
  }));
  // Ordered by where they sit on the board, not by how far they move: the
  // biggest swings belong to backup quarterbacks nobody drafts, and the point
  // of the example is to show you a player you would actually consider.
  moved.sort((a, b) => a.rank - b.rank);
  return { same, moved };
}

function scoreFromStats(st, sc) {
  const per = (v, d) => (d ? v / d : 0);
  return per(st.passYds, sc.passYd) + st.passTds * sc.passTd + st.ints * sc.intp
       + per(st.rushYds, sc.rushYd) + st.rushTds * sc.rushTd
       + st.recs * sc.ppr + per(st.recYds, sc.recYd) + st.recTds * sc.recTd;
}

const anyStats = () => S.sources.some(src => src.players.some(p => p.stats && usableStats(p)));

/* Work out what scoring a list was built on by trying the handful of rules
   sites actually use and seeing which one reproduces its own points column.
   Two lists from the same site can be the same projections scored
   differently - and averaging a full-PPR total with a half-PPR one produces a
   number that is neither. */
const PPR_TRIES = [1, 0.5, 0], PASSTD_TRIES = [4, 6], PASSYD_TRIES = [25, 20];
function fitScoring(players) {
  const usable = players.filter(p => p.stats && usableStats(p) && p.projFile != null);
  if (usable.length < 10) return null;
  let best = null;
  PPR_TRIES.forEach(ppr => PASSTD_TRIES.forEach(passTd => PASSYD_TRIES.forEach(passYd => {
    const rule = { ppr, passTd, passYd, intp: -2, rushYd: 10, rushTd: 6, recYd: 10, recTd: 6 };
    let hit = 0;
    usable.forEach(p => {
      if (Math.abs(Math.round(scoreFromStats(p.stats, rule)) - p.projFile) <= 2) hit++;
    });
    if (!best || hit > best.hit) best = { ppr, passTd, passYd, hit, n: usable.length };
  })));
  // Only claim a format when it explains nearly the whole file.
  return best && best.hit / best.n >= 0.9 ? best : null;
}
const pprName = v => v === 1 ? "full PPR" : v === 0.5 ? "half PPR" : v === 0 ? "standard" : v + " / catch";
const describeFit = fit => fit
  ? `${pprName(fit.ppr)} · ${fit.passTd}-pt pass TD · 1 pt / ${fit.passYd} pass yds`
  : "scoring not recognised";

/* Some rows carry a points total but blank yardage - the file projected them
   without publishing the components. Rebuilding those from nothing would
   invent a much smaller number, so they keep whatever the file said. */
function usableStats(p) {
  const st = p.stats;
  if (!st) return false;
  const yards = (st.passYds || 0) + (st.rushYds || 0) + (st.recYds || 0);
  if (yards > 0) return true;
  return !(p.projFile > 20);      // no yards at all, yet the file claims points
}

/* Rewrites projected points across every loaded list. Players with no stat
   line - kickers and defences, mostly - keep the file's own number, because
   zero would be a lie rather than a recalculation. */
function applyScoring() {
  const sc = S.cfg.scoring;
  S.sources.forEach(src => src.players.forEach(p => {
    if (p.projFile === undefined) p.projFile = p.proj;
    p.proj = (sc.on && p.stats && usableStats(p)) ? Math.round(scoreFromStats(p.stats, sc))
                                                  : p.projFile;
  }));
}

/* Someone will eventually call a name your file does not contain - a deep
   rookie, a handcuff outside the top 400. If that pick cannot be logged, the
   pick count silently diverges from the real room and every clock reading,
   survival figure and cost-of-waiting number after it is wrong. So it gets
   logged as a player, just one that came from the room rather than a file.
   These live outside the ranking sets so they survive switching between them. */
function addOffBoard(name, pos, team) {
  const p = {
    id: "off:" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: (name || "").trim() || "Unnamed pick",
    pos: POS.includes(pos) ? pos : "—",
    team: normTeam(team || "") || "—",
    rank: 99999, tier: null, adp: null, bye: null,
    proj: null, projFile: null, stats: null, off: true,
  };
  S.offBoard.push(p);
  return p;
}
const dropOffBoard = pid => { S.offBoard = S.offBoard.filter(p => p.id !== pid); };

function refreshActive() {
  applyScoring();
  const extra = S.offBoard || [];
  if (!S.sources.length) { S.players = extra.slice(); return; }
  if (S.activeSource === CONSENSUS && S.sources.length > 1) {
    S.players = buildConsensus().concat(extra); return;
  }
  const src = sourceById(S.activeSource) || S.sources[0];
  S.activeSource = src.id;
  S.players = src.players.concat(extra);
}

const activeSourceName = () =>
  S.activeSource === CONSENSUS && S.sources.length > 1
    ? `Consensus of ${S.sources.length}`
    : (sourceById(S.activeSource)?.name || "—");

/* ================================================================
   ARTICLE PICKS
   Paste any prose - a staff-picks piece, a bare list of names, your own
   notes - and find the players in it. Matching runs against the board you
   already loaded, so it needs no network and knows nothing about any
   particular site's HTML.
   ================================================================ */
const POLARITY = {
  target: { glyph: "▲", word: "Target", tone: "good" },
  watch:  { glyph: "●", word: "Watch",  tone: "warn" },
  avoid:  { glyph: "▼", word: "Avoid",  tone: "crit" },
  hurt:   { glyph: "✚", word: "Injured", tone: "crit" },
};

/* Surnames that are also ordinary English words. A bare "Love", "Little" or
   "Chase" in a sentence is far more often prose than a player, so these are
   never matched on the surname alone - the full name still matches. */
const COMMON_WORD_SURNAMES = new Set(("love little price gray hunter dell ward boston rice reed bell "
  + "king chase cook young sanders waller bright brown smith jones hill moore allen west wright "
  + "carter bates coleman johnson williams davis taylor watson james white green black long short "
  + "st strong swift bush stroud pitts rush mason walker gordon parker foster hall").split(" "));

/* Tokenise with case and position kept. Case is the whole defence against a
   name that only exists by accident: "Don't chase Brown early" contains the
   words "chase brown", which is exactly the player Chase Brown - but the verb
   is lowercase, and a real mention never is. Offsets let the snippet come from
   the original prose rather than a flattened copy. */
function tokenize(text) {
  const toks = [], re = /[A-Za-z0-9\u00C0-\u024F'\u2019]+/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const raw = m[0];
    toks.push({
      w: raw.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, ""),
      cap: raw[0] !== raw[0].toLowerCase(),
      at: m.index,
    });
  }
  return toks.filter(t => t.w);
}

const bareName = p => {
  let n = String(p.name).toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/['\u2019]/g, "")          // must vanish, exactly as in tokenize()
    .replace(/[^a-z0-9]+/g, " ").trim();
  let prev;
  do { prev = n; n = n.replace(/\s+(jr|sr|ii|iii|iv|v)$/, "").trim(); } while (n !== prev);
  return n;
};

/* Returns two buckets. `sure` matched every word of a full name, each of them
   capitalised, and is pre-selected. `maybe` matched a surname alone - "Brown"
   belongs to three players on this board - and waits for you to confirm. */
function scanText(text) {
  const toks = tokenize(text);
  if (!toks.length || !S.players.length) return { sure: [], maybe: [] };
  const pool = S.players;

  const snippet = at => {
    const from = Math.max(0, at - 40), to = Math.min(text.length, at + 150);
    let cut = text.slice(from, to).replace(/\s+/g, " ").trim();
    if (from > 0) cut = "…" + cut.replace(/^\S+\s/, "");
    if (to < text.length) cut = cut.replace(/\s\S+$/, "") + "…";
    return cut;
  };

  // word -> every index it occurs at, so lookup is not a scan per player
  const idx = new Map();
  toks.forEach((t, i) => {
    if (!idx.has(t.w)) idx.set(t.w, []);
    idx.get(t.w).push(i);
  });

  const bySurname = new Map();
  pool.forEach(p => {
    const parts = bareName(p).split(" ");
    if (parts.length < 2) return;
    const sn = parts[parts.length - 1];
    if (!bySurname.has(sn)) bySurname.set(sn, []);
    bySurname.get(sn).push(p);
  });

  const seen = new Set(), sure = [], maybe = [];

  pool.forEach(p => {
    const words = bareName(p).split(" ");
    if (words.length < 2 || seen.has(p.id)) return;
    for (const i of (idx.get(words[0]) || [])) {
      if (i + words.length > toks.length) continue;
      let hit = true;
      for (let k = 0; k < words.length; k++) {
        const t = toks[i + k];
        if (t.w !== words[k] || !t.cap) { hit = false; break; }
      }
      if (!hit) continue;
      seen.add(p.id);
      sure.push({ pid: p.id, name: p.name, pos: p.pos, team: p.team, snippet: snippet(toks[i].at) });
      break;
    }
  });

  bySurname.forEach((players, sn) => {
    if (players.length !== 1) return;              // more than one player answers to it
    if (COMMON_WORD_SURNAMES.has(sn)) return;      // ordinary English word
    if (sn.length < 4) return;
    const p = players[0];
    if (seen.has(p.id)) return;
    const at = (idx.get(sn) || []).find(i => toks[i].cap);
    if (at == null) return;
    seen.add(p.id);
    maybe.push({ pid: p.id, name: p.name, pos: p.pos, team: p.team, snippet: snippet(toks[at].at) });
  });

  const rk = id => (pool.find(x => x.id === id) || {}).rank ?? 9999;
  sure.sort((a,b) => rk(a.pid) - rk(b.pid));
  maybe.sort((a,b) => rk(a.pid) - rk(b.pid));
  return { sure, maybe };
}

/* Injury and suspension flags. Kept against the player key rather than inside
   a ranking set, so they survive switching lists and ride along in a backup -
   and so a re-import never silently wipes them. */
const STATUS = {
  Q:   { word: "Questionable", tone: "warn" },
  D:   { word: "Doubtful",     tone: "warn" },
  O:   { word: "Out",          tone: "crit" },
  IR:  { word: "Injured reserve", tone: "crit" },
  PUP: { word: "PUP list",     tone: "crit" },
  SUS: { word: "Suspended",    tone: "crit" },
};
const STATUS_CODES = Object.keys(STATUS);
const statusOf = pid => S.status[pid] || null;
function setStatus(pid, code) {
  if (code && STATUS[code]) S.status[pid] = code;
  else delete S.status[pid];
}

/* What a file might call it, and what a person might have typed. */
function readStatus(raw) {
  const t = String(raw || "").trim().toLowerCase();
  if (!t || /^(active|healthy|ok|none|-)$/.test(t)) return null;
  if (/susp/.test(t)) return "SUS";
  if (/\bpup\b|physically unable/.test(t)) return "PUP";
  if (/injured reserve|\bi\.?r\.?\b/.test(t)) return "IR";
  if (/doubt/.test(t)) return "D";
  if (/quest/.test(t)) return "Q";
  if (/\bout\b|\bo\b/.test(t)) return "O";
  if (/\bd\b/.test(t)) return "D";
  if (/\bq\b/.test(t)) return "Q";
  return null;
}

const notesFor = pid => S.notes.filter(n => n.pid === pid);

/* A note keyed to a player who isn't in the list you're currently using still
   has to read as a name rather than "ja marr chase|WR". */
const prettyKey = pid => String(pid).split("|")[0]
  .replace(/\b[a-z]/g, c => c.toUpperCase()) || "Unknown";

/* Which NFL clubs you already own, so the board can point out a quarterback's
   receiver or the back-up behind your starting running back. Rebuilt once per
   render rather than per row. */
let MY_CLUBS = new Map();
function refreshClubs() {
  MY_CLUBS = new Map();
  rosterOf(S.cfg.mySlot - 1).forEach(p => {
    if (!p.team || p.team === "—") return;
    if (!MY_CLUBS.has(p.team)) MY_CLUBS.set(p.team, []);
    MY_CLUBS.get(p.team).push(p);
  });
}
const CATCHERS = ["WR", "TE"];
function clubLink(p) {
  const mates = MY_CLUBS.get(p.team);
  if (!mates) return null;
  for (const m of mates) {
    if (m.id === p.id) continue;
    if (m.pos === "QB" && CATCHERS.includes(p.pos)) return { kind: "stack", with: m };
    if (CATCHERS.includes(m.pos) && p.pos === "QB") return { kind: "stack", with: m };
    if (m.pos === "RB" && p.pos === "RB") return { kind: "cuff", with: m };
  }
  return null;
}
const lastName = n => String(n).replace(/\s+(Jr\.?|Sr\.?|II|III|IV|V)$/i, "").split(/\s+/).pop();

/* Two articles disagreeing about a player is worth seeing, so tally each
   verdict rather than collapsing to one. */
function noteTally(pid) {
  const t = {};
  notesFor(pid).forEach(n => { t[n.pol] = (t[n.pol] || 0) + 1; });
  return t;
}
const noteSources = () => {
  const m = new Map();
  S.notes.forEach(n => {
    const k = JSON.stringify([n.source, n.pol]);
    if (!m.has(k)) m.set(k, { source: n.source, pol: n.pol, n: 0 });
    m.get(k).n++;
  });
  return [...m.values()];
};

/* ================================================================
   SNAKE MATH
   ================================================================ */
const totalPicks = () => S.cfg.teams * S.cfg.rounds;
const currentPick = () => S.picks.length + 1;

function teamOnClock(overall) {
  const T = S.cfg.teams;
  const r = Math.ceil(overall / T);
  const i = overall - (r - 1) * T;          // 1..T within the round
  let forward;
  if (S.cfg.trr) forward = r === 1 ? true : (r === 2 ? false : r % 2 === 0);
  else forward = r % 2 === 1;
  return forward ? i - 1 : T - i;           // 0-indexed team
}
const roundOf = o => Math.ceil(o / S.cfg.teams);
const slotInRound = o => o - (roundOf(o) - 1) * S.cfg.teams;

function myNextPick(from) {
  const me = S.cfg.mySlot - 1, max = totalPicks();
  for (let o = from; o <= max; o++) if (teamOnClock(o) === me) return o;
  return null;
}
function picksUntilMine() {
  const nxt = myNextPick(currentPick());
  return nxt == null ? null : nxt - currentPick();
}

/* ---------------- survival odds ----------------
   P(still there at my next turn | still there now).
   ADP is treated as the mean of a normal draft-position distribution
   whose spread grows with ADP — early picks are predictable, late
   ones are noise. Tune the spread with the volatility slider. */
function erf(x) {
  const s = Math.sign(x); x = Math.abs(x);
  const a1=.254829592, a2=-.284496736, a3=1.421413741, a4=-1.453152027, a5=1.061405429, p=.3275911;
  const t = 1/(1+p*x);
  return s * (1 - ((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t*Math.exp(-x*x));
}
const ncdf = z => .5 * (1 + erf(z / Math.SQRT2));

function survival(p, from, to) {
  if (p.adp == null || to == null || to <= from) return null;
  const sd = Math.max(3, 2 + S.cfg.vol * p.adp);
  const F = n => ncdf((n - p.adp) / sd);       // P(gone by pick n)
  const now = 1 - F(from - 1);
  const then = 1 - F(to - 1);
  if (now < 0.002) return 0;
  return Math.max(0, Math.min(1, then / now));
}

/* ---------------- replacement level / VORP ---------------- */
function replacementPoints(avail) {
  const { teams, slots } = S.cfg;
  const flexShare = { RB: .45, WR: .45, TE: .10 };
  const out = {};
  POS.forEach(pos => {
    const starters = (slots[pos] || 0) + (flexShare[pos] || 0) * (slots.FLEX || 0);
    const depth = Math.max(1, Math.round(starters * teams));
    const grp = avail.filter(p => p.pos === pos && p.proj != null).sort((a,b) => b.proj - a.proj);
    out[pos] = grp.length ? (grp[Math.min(depth, grp.length) - 1].proj) : null;
  });
  return out;
}
const hasProj = () => S.players.some(p => p.proj != null);

/* ================================================================
   COST OF WAITING

   The question a snake pick actually poses is not "who is best?" but "who
   will not be here next time?". Spending a pick on someone who would have
   survived the round trip wastes it.

   For each position: the value on the board now, against the value you can
   expect to still be there at your next turn. The second is a proper
   expectation, not the best survivor - walk the position in value order and
   accumulate P(this one is the best still standing) = P(he lasts) x
   P(nobody above him lasted).
   ================================================================ */
function valueOf(p) {
  if (p.proj != null) return p.proj;
  return null;
}

function expectedBestAt(pos, avail, from, to) {
  const list = avail
    .filter(p => p.pos === pos && valueOf(p) != null && p.adp != null)
    .sort((a, b) => valueOf(b) - valueOf(a));
  if (!list.length) return null;
  let none = 1, ev = 0, any = 0;
  for (const p of list) {
    const sv = survival(p, from, to);
    if (sv == null) continue;
    const here = none * sv;
    ev += here * valueOf(p);
    any += here;
    none *= (1 - sv);
    if (none < 0.002) break;
  }
  return any > 0.02 ? ev / any : null;
}

/* One row per position you still have to start. `drop` is what the round trip
   costs you there. */
function waitCosts() {
  const V = view();
  if (V.nxt == null || !hasProj()) return [];
  const me = S.cfg.mySlot - 1;
  const need = new Set(openNeeds(me).flatMap(l => l === "FLEX" ? ["RB", "WR", "TE"] : [l]));
  const out = [];
  SKILL.forEach(pos => {
    const here = V.avail.filter(p => p.pos === pos && valueOf(p) != null)
      .sort((a, b) => valueOf(b) - valueOf(a))[0];
    if (!here) return;
    const later = expectedBestAt(pos, V.avail, V.cur, V.nxt);
    if (later == null) return;
    out.push({
      pos,
      best: here,
      now: valueOf(here),
      later,
      drop: Math.round(valueOf(here) - later),
      needed: need.has(pos),
    });
  });
  out.sort((a, b) => b.drop - a.drop);
  return out;
}

/* ================================================================
   DERIVED VIEW OF THE DRAFT
   ================================================================ */
function drafted() { return new Set(S.picks.map(p => p.pid)); }

function view() {
  const taken = drafted();
  const avail = S.players.filter(p => !taken.has(p.id));
  const cur = currentPick();
  const onClock = teamOnClock(cur) === S.cfg.mySlot - 1;
  const nxt = onClock ? myNextPick(cur + 1) : myNextPick(cur);
  const repl = hasProj() ? replacementPoints(avail) : null;

  avail.forEach(p => {
    p._surv = survival(p, cur, nxt);
    /* RK is your source's opinion; ADP is what the rest of the world is doing.
       The gap between them is the only number here that isn't already implied
       by something else on the row - and it's the one that changes a pick.
       Positive: the market lets him go later than you rank him, so you can
       wait. Negative: the room takes him well before your board says he's
       worth it, so he's not realistically yours.
       (The old measure, adp - currentPick, was just ADP shifted by a constant
       - identical ordering to the ADP sort, and no information of its own.) */
    /* Skill positions only. Nobody drafts differently because their list has
       a kicker 2 spots off the market's, and with only ~28 K and 32 DST on the
       board those tiny denominators dominate a ratio and bury the real reads. */
    p._edge = (p.adpReal && p.adp != null && p.apr != null && SKILL.includes(p.pos)
               && Math.min(p.rank, p.adp) <= totalPicks())
      ? p.apr - p.pr : null;
    /* Shown as plain spots because that's what's readable, but ORDERED by the
       ratio: 26 spots between WR50 and WR76 is noise, 26 spots between WR6 and
       WR32 decides your draft. Sorting the raw difference just floats the deep
       end, where neither list means much. */
    p._edgeScore = p._edge == null ? null : Math.log(p.apr) - Math.log(p.pr);
    p._vorp = (repl && p.proj != null && repl[p.pos] != null) ? Math.round(p.proj - repl[p.pos]) : null;
  });

  // best remaining tier per position + how many are left in it
  const tiers = {};
  POS.forEach(pos => {
    const grp = avail.filter(p => p.pos === pos).sort((a,b) => a.rank - b.rank);
    if (!grp.length) { tiers[pos] = null; return; }
    const t = grp[0].tier;
    tiers[pos] = { tier: t, left: grp.filter(p => p.tier === t).length, total: grp.length };
  });

  return { avail, taken, cur, nxt, tiers, repl };
}

function rosterOf(teamIdx) {
  return S.picks.filter(p => p.team === teamIdx)
                .map(p => S.players.find(x => x.id === p.pid))
                .filter(Boolean);
}

/* Greedy slotting: dedicated slots first, then FLEX takes the best
   leftover skill player, everything else is bench. */
function fillSlots(list) {
  const { slots } = S.cfg;
  const pool = [...list].sort((a,b) => a.rank - b.rank);
  const used = new Set();
  const rows = [];
  const take = pos => {
    const p = pool.find(x => !used.has(x.id) && x.pos === pos);
    if (p) used.add(p.id);
    return p || null;
  };
  ["QB","RB","WR","TE"].forEach(pos => {
    for (let i = 0; i < (slots[pos] || 0); i++) rows.push({ lab: pos, p: take(pos) });
  });
  for (let i = 0; i < (slots.FLEX || 0); i++) {
    const p = pool.find(x => !used.has(x.id) && ["RB","WR","TE"].includes(x.pos));
    if (p) used.add(p.id);
    rows.push({ lab: "FLEX", p: p || null });
  }
  ["K","DST"].forEach(pos => {
    for (let i = 0; i < (slots[pos] || 0); i++) rows.push({ lab: pos, p: take(pos) });
  });
  pool.filter(p => !used.has(p.id)).forEach(p => rows.push({ lab: "BN", p }));
  return rows;
}

/* Everything below compares your team with the other eleven rather than with
   an abstract par. Every team has made the same number of picks, so the
   comparison is fair from the very first round and moves as the draft does. */
const STARTERS = rows => rows.filter(r => r.lab !== "BN" && r.p);

function teamPoints(teamIdx) {
  const rows = STARTERS(fillSlots(rosterOf(teamIdx)));
  const byPos = {}; let total = 0;
  rows.forEach(r => {
    const v = r.p.proj;
    if (v == null) return;
    total += v;
    // a FLEX counts toward the position the player actually plays
    byPos[r.p.pos] = (byPos[r.p.pos] || 0) + v;
  });
  return { total, byPos, starters: rows.length };
}

function leagueAverages() {
  const per = [];
  for (let i = 0; i < S.cfg.teams; i++) per.push(teamPoints(i));
  const avg = { total: 0, byPos: {} };
  per.forEach(t => {
    avg.total += t.total;
    POS.forEach(pos => { avg.byPos[pos] = (avg.byPos[pos] || 0) + (t.byPos[pos] || 0); });
  });
  avg.total /= S.cfg.teams;
  POS.forEach(pos => { avg.byPos[pos] /= S.cfg.teams; });
  return { avg, per };
}

/* Picks of value: a player whose ADP was 20 taken at pick 30 is ten picks of
   value. Sums only over players who had an ADP to begin with. */
function valueCaptured(teamIdx) {
  let spots = 0, counted = 0;
  S.picks.filter(pk => pk.team === teamIdx).forEach(pk => {
    const p = S.players.find(x => x.id === pk.pid);
    if (!p || p.adp == null) return;
    spots += p.adp - pk.overall;
    counted++;
  });
  return { spots: Math.round(spots), counted };
}

/* Which weeks would leave you starting replacements, and how badly. */
function byeLoad(teamIdx) {
  const weeks = {};
  STARTERS(fillSlots(rosterOf(teamIdx))).forEach(r => {
    if (!r.p.bye) return;
    (weeks[r.p.bye] = weeks[r.p.bye] || []).push(r.p);
  });
  let worst = null;
  Object.entries(weeks).forEach(([w, list]) => {
    if (!worst || list.length > worst.n) worst = { week: +w, n: list.length };
  });
  return { weeks, worst };
}

function openNeeds(teamIdx) {
  return fillSlots(rosterOf(teamIdx)).filter(r => !r.p && r.lab !== "BN").map(r => r.lab);
}

function byeClashes(list) {
  const counts = {};
  fillSlots(list).forEach(r => {
    if (!r.p || r.lab === "BN" || !r.p.bye) return;
    counts[r.p.bye] = (counts[r.p.bye] || 0) + 1;
  });
  return counts;
}

/* Positional run over the last 8 picks. */
function runInfo() {
  const last = S.picks.slice(-8).map(p => S.players.find(x => x.id === p.pid)).filter(Boolean);
  const c = {};
  last.forEach(p => c[p.pos] = (c[p.pos] || 0) + 1);
  let hot = null;
  Object.entries(c).forEach(([pos, n]) => {
    if (n >= 4 && (!hot || n > hot.n)) hot = { pos, n };
  });
  return { last, hot, window: last.length };
}

/* ================================================================
   ACTIONS
   ================================================================ */
function pushPick(pid, teamIdx) {
  if (S.picks.some(p => p.pid === pid)) return false;
  if (S.picks.length >= totalPicks()) return false;
  const overall = currentPick();
  const snake = teamOnClock(overall);
  const team = teamIdx ?? snake;
  // Remember that a pick broke snake order, so renumbering can't silently "correct" it.
  S.picks.push({ pid, team, overall, manual: teamIdx != null && teamIdx !== snake });
  S.queue = S.queue.filter(q => q !== pid);
  return true;
}

function draftPlayer(pid, teamIdx) {
  if (S.picks.some(p => p.pid === pid)) return;
  if (S.picks.length >= totalPicks()) { toast("Draft is complete — all " + totalPicks() + " picks are in."); return; }
  pushPick(pid, teamIdx);
  commit();
}

/* ---------------- rehearsal ----------------
   Stand-in opponents so the whole thing can be driven end to end before it
   counts. They draft near ADP, lean toward slots they still have to fill,
   and leave kickers and defences until the last rounds - close enough that
   the board behaves like a real room. */
function autoPickFor(team) {
  const taken = drafted();
  const round = roundOf(currentPick());
  const lateEnough = round >= S.cfg.rounds - 2;
  let pool = S.players.filter(p => !taken.has(p.id) && p.adp != null)
    .sort((a, b) => a.adp - b.adp);
  if (!lateEnough) {
    const skill = pool.filter(p => p.pos !== "K" && p.pos !== "DST");
    if (skill.length) pool = skill;
  }
  if (!pool.length) {
    pool = S.players.filter(p => !taken.has(p.id)).sort((a, b) => a.rank - b.rank);
    if (!pool.length) return false;
  }
  const need = new Set(openNeeds(team).flatMap(l => l === "FLEX" ? ["RB", "WR", "TE"] : [l]));
  const wanted = pool.filter(p => need.has(p.pos));
  const from = (wanted.length && Math.random() < 0.75) ? wanted : pool;
  return pushPick(from[Math.floor(Math.random() * Math.min(3, from.length))].id, team);
}

/* Runs the room forward to your turn. One commit at the end, not one per pick. */
function simulateToMyPick() {
  const me = S.cfg.mySlot - 1;
  let n = 0;
  while (S.picks.length < totalPicks() && teamOnClock(currentPick()) !== me) {
    if (!autoPickFor(teamOnClock(currentPick()))) break;
    if (++n > totalPicks()) break;
  }
  commit();
  return n;
}
function undo() {
  if (!S.picks.length) return;
  const gone = S.picks.pop();
  if (String(gone.pid).startsWith("off:")) { dropOffBoard(gone.pid); refreshActive(); }
  commit();
}
/* Changing the league size or the reversal rule changes who owns which pick,
   so every pick already logged has to be re-seated. Without this, picks made
   for teams beyond the new size are orphaned: still off the board, on nobody's
   roster, invisible in the League view and absent from every roster count. */
function reseatPicks() {
  const last = S.cfg.teams - 1;
  S.picks = S.picks.map(p => ({
    ...p,
    team: p.manual ? Math.min(p.team, last) : teamOnClock(p.overall),
  }));
}

function removePick(overall) {
  const gone = S.picks.find(p => p.overall === overall);
  if (gone && String(gone.pid).startsWith("off:")) { dropOffBoard(gone.pid); refreshActive(); }
  S.picks = S.picks.filter(p => p.overall !== overall)
                   .sort((a,b) => a.overall - b.overall)
                   .map((p, i) => ({ ...p, overall: i + 1,
                                     team: p.manual ? p.team : teamOnClock(i + 1) }));
  commit();
}
function toggleQueue(pid) {
  S.queue = S.queue.includes(pid) ? S.queue.filter(q => q !== pid) : [...S.queue, pid];
  commit();
}
function commit() { save(); render(); }

/* ---------------- backup ----------------
   The page is the program; everything you set up - rankings, article picks,
   league settings, picks so far - lives in this browser's storage and does
   NOT travel with the file. A backup is how a setup built on one device
   reaches another. S.players is left out because it is rebuilt from
   S.sources on load. */
const backupPayload = () => JSON.stringify({ ...S, players: undefined }, null, 1);

function applyBackup(obj) {
  if (!obj || typeof obj !== "object") throw new Error("not a backup");
  if (!Array.isArray(obj.sources) && !Array.isArray(obj.players))
    throw new Error("no rankings inside");
  const keepTheme = S.theme;
  S = Object.assign(defaults(), obj);
  S.cfg = Object.assign(defaults().cfg, obj.cfg || {});
  S.ui  = Object.assign(defaults().ui,  obj.ui  || {});
  if (S.theme == null) S.theme = keepTheme;
  migrate();          // accepts a backup written before ranking sets existed
  refreshActive();
  applyTheme();
  commit();
  return {
    lists: S.sources.length,
    players: S.players.length,
    notes: S.notes.length,
    picks: S.picks.length,
  };
}

/* Two ways to hand over a file, because this page runs in two places.
   Opened from your own disk it is an ordinary web page and the browser
   saves the blob. Opened in the hosted viewer the frame cannot download
   anything itself, and the host mediates the save instead. Asked for early
   so the answer is ready by the time anyone reaches the Setup tab. */
const inViewer = () => !!(window.claude && typeof window.claude.use === "function");
let downloadsPromise = null;
function downloadsCap() {
  if (!downloadsPromise) {
    downloadsPromise = Promise.resolve(null);
    if (inViewer()) {
      // A host that throws instead of rejecting would otherwise escape before
      // the .catch is attached, and the button would just look dead.
      try {
        downloadsPromise = Promise.resolve(window.claude.use("downloads")).catch(() => null);
      } catch (e) { downloadsPromise = Promise.resolve(null); }
    }
  }
  return downloadsPromise;
}
downloadsCap();   // warm it; the namespace never resolves on this first run

function saveViaBrowser(name, text) {
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function downloadBackup() {
  const name = `draft-kit-${new Date().toISOString().slice(0, 10)}.json`;
  const text = backupPayload();
  const cap = await downloadsCap();
  if (cap) {
    try {
      await cap.save({ filename: name, data: text });
      toast("Backup saved.");
    } catch (err) {
      const code = err && err.code;
      if (code === "declined") toast("Save cancelled.");
      else if (code === "rate_limited") toast("A save is already in progress — try again in a moment.");
      else if (code === "too_large") toast("Too big to save as a file — use the clipboard instead.");
      else toast("Couldn't save a file here — use Copy backup to clipboard.");
    }
    return;
  }
  if (inViewer()) {   // hosted, but saving isn't on offer in this view
    toast("Saving files isn't available here — use Copy backup to clipboard.");
    return;
  }
  try { saveViaBrowser(name, text); toast("Backup saved to your downloads."); }
  catch (e) { toast("Couldn't save a file here — use Copy backup to clipboard."); }
}

let toastT = null;
function toast(msg) {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:80;"
      + "background:var(--ink);color:var(--surface);padding:9px 15px;border-radius:6px;font-size:13px;"
      + "font-weight:600;box-shadow:var(--shadow-lift);max-width:88vw;text-align:center;";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.style.display = "none"; }, 2400);
}

/* ================================================================
   RENDER
   ================================================================ */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const posVar = pos => `--p:var(--pos-${POS.includes(pos) ? pos : "K"})`;
const teamName = i => (S.cfg.names[i] && S.cfg.names[i].trim()) || `Team ${i + 1}`;

function render() {
  refreshClubs();
  syncSortOptions();
  renderSourcePicker();
  renderVerdict();
  renderStatus();
  renderFilters();
  renderBoard();
  renderSide();
  renderTeam();
  renderLeague();
  renderLog();
  renderSetup();
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", String(t.dataset.tab === S.ui.tab)));
  document.querySelectorAll(".pane, .pane-split").forEach(p =>
    p.classList.toggle("on", p.id === "pane-" + S.ui.tab));
}

function renderStatus() {
  const V = view();
  const mine = teamOnClock(V.cur) === S.cfg.mySlot - 1;
  const done = S.picks.length >= totalPicks();
  const until = picksUntilMine();

  const st = document.getElementById("status");
  st.dataset.mine = mine && !done ? "1" : "0";

  const cn = document.getElementById("clockN");
  const cl = document.getElementById("clockL");
  if (!S.players.length) { cn.textContent = "—"; cl.innerHTML = "<b>load</b>rankings"; }
  else if (done)         { cn.textContent = "✓"; cl.innerHTML = "<b>draft</b>complete"; }
  else if (mine)         { cn.textContent = "0"; cl.innerHTML = "<b>you're up</b>pick now"; }
  else if (until == null){ cn.textContent = "–"; cl.innerHTML = "<b>no more</b>picks"; }
  else                   { cn.textContent = until; cl.innerHTML = "<b>picks</b>until you"; }

  document.getElementById("rp").textContent =
    done ? "Final" : `R${roundOf(V.cur)}·${String(slotInRound(V.cur)).padStart(2,"0")}`;
  document.getElementById("onclock").textContent =
    !S.players.length ? "Load your rankings to start"
    : done ? `${totalPicks()} picks recorded`
    : mine ? "YOU ARE ON THE CLOCK"
    : `${teamName(teamOnClock(V.cur))} on the clock · pick ${V.cur} of ${totalPicks()}`;

  // Alert chips: only what changes a decision right now
  const chips = [];
  const run = runInfo();
  if (run.hot) chips.push(`<span class="chip chip-warn"><span class="dot"></span>${run.hot.pos} run · ${run.hot.n} of last ${run.window}</span>`);

  // Only warn about a cliff at a position you still have to fill, and only
  // about the two most urgent — five simultaneous alarms say nothing.
  const me = S.cfg.mySlot - 1;
  const needs = openNeeds(me);
  const needSet = new Set(needs.flatMap(l => l === "FLEX" ? ["RB","WR","TE"] : [l]));
  if (until != null && until > 0) {
    POS.slice(0,4)
      .map(pos => ({ pos, t: V.tiers[pos] }))
      .filter(x => x.t && x.t.left <= 2 && needSet.has(x.pos))
      .sort((a,b) => a.t.left - b.t.left)
      .slice(0,2)
      .forEach(x => chips.push(
        `<span class="chip chip-crit"><span class="dot"></span>${x.pos} tier ${x.t.tier} · ${x.t.left} left</span>`));
  }
  if (needs.length && rosterOf(me).length)
    chips.push(`<span class="chip chip-mute"><span class="dot"></span>Need ${needs.slice(0,4).join(" ")}</span>`);

  document.getElementById("undoBtn").disabled = !S.picks.length;

  const sim = document.getElementById("simBtn");
  sim.hidden = !S.cfg.rehearse;
  sim.disabled = done || mine;
  if (S.cfg.rehearse)
    chips.unshift(`<span class="chip chip-warn"><span class="dot"></span>Rehearsal</span>`);
  document.getElementById("alerts").innerHTML = chips.join("");
}

function renderSourcePicker() {
  const el = document.getElementById("srcrow");
  const multi = S.sources.length > 1;
  el.hidden = !multi;
  if (!multi) return;
  const items = [{ id: CONSENSUS, name: `Consensus · ${S.sources.length}` }, ...S.sources];
  el.innerHTML = `<span class="eyebrow">Ranks</span>` + items.map(x =>
    `<button class="sbtn-src" data-src="${x.id}" aria-pressed="${S.activeSource === x.id}">${esc(x.name)}</button>`
  ).join("");
}

function renderVerdict() {
  const el = document.getElementById("verdict");
  if (!el) return;
  const costs = waitCosts();
  const needed = costs.filter(c => c.needed);
  // Rank within the slots you still have to fill - the costliest position
  // overall is no use if you already have that starter. The runner-up has to
  // come from the same list, or the sentence contradicts its own number.
  const pool = needed.length ? needed : costs;
  const top = pool[0];
  /* A one-point drop is not a reason to change your pick, and a banner that
     says so is worse than no banner - it spends the reader's attention on
     noise and makes the real warnings easier to ignore. Below a handful of
     points, say nothing; the full table in the side panel still shows it. */
  const WORTH_SAYING = 5;
  if (!top || top.drop < WORTH_SAYING) { el.innerHTML = ""; return; }
  const runner = pool[1];
  const why = needed.length
    ? "costliest slot you still need"
    : "biggest drop-off on the board";
  el.innerHTML = `
    <button class="verdict" data-f="${top.pos}" style="${posVar(top.pos)}"
      title="Filter the board to ${top.pos}">
      <span class="verdict-pos">${top.pos}</span>
      <span class="verdict-t"><b>${esc(top.best.name)}</b> now
        <span>&middot; ${why}${runner ? ` &middot; ${runner.pos} next at ${Math.max(0, runner.drop)}` : ""}</span></span>
      <span class="verdict-n">&minus;${top.drop}</span>
    </button>`;
}

function renderFilters() {
  const V = view();
  const el = document.getElementById("filters");
  const counts = { ALL: V.avail.length };
  POS.forEach(p => counts[p] = V.avail.filter(x => x.pos === p).length);
  // Count what the Queue tab will actually render: a player starred under one
  // ranking set may not exist in the set you're using now.
  const queued = V.avail.filter(p => S.queue.includes(p.id)).length;
  const noted = { TARGET: 0, AVOID: 0 };
  V.avail.forEach(p => {
    const t = noteTally(p.id);
    if (t.target) noted.TARGET++;
    if (t.avoid)  noted.AVOID++;
  });
  // Keep the filter you're standing on visible even after it empties, or the
  // board goes blank with no way back and no explanation.
  const items = ["ALL", ...POS.filter(p => counts[p] > 0 || S.ui.filter === p), "QUEUE",
    ...(noted.TARGET || S.ui.filter === "TARGET" ? ["TARGET"] : []),
    ...(noted.AVOID  || S.ui.filter === "AVOID"  ? ["AVOID"]  : [])];
  el.innerHTML = items.map(k => {
    const on = S.ui.filter === k;
    const n = k === "QUEUE" ? queued : (k === "TARGET" || k === "AVOID") ? noted[k] : counts[k];
    const style = POS.includes(k) ? ` style="${posVar(k)}"` : "";
    const attr  = POS.includes(k) ? ` data-pos="${k}"` : "";
    const label = k === "QUEUE" ? "★ Queue"
      : k === "TARGET" ? `<span style="color:var(--good)">▲</span> Targets`
      : k === "AVOID"  ? `<span style="color:var(--crit)">▼</span> Avoid`
      : k;
    return `<button class="fbtn"${attr}${style} aria-pressed="${on}" data-f="${k}">${label} <span style="opacity:.6">${n}</span></button>`;
  }).join("");

  // The pill row scrolls sideways on a tablet, so the filter you just chose can
  // sit off-screen with nothing showing which one is live. Nudge it into view -
  // scrolling this container only, never the page.
  const act = el.querySelector('[aria-pressed="true"]');
  if (act) {
    const l = act.offsetLeft, r = l + act.offsetWidth;
    if (l < el.scrollLeft) el.scrollLeft = Math.max(0, l - 8);
    else if (r > el.scrollLeft + el.clientWidth) el.scrollLeft = r - el.clientWidth + 8;
  }
}

function playerRow(p, V, opts = {}) {
  const q = S.queue.includes(p.id);
  const surv = p._surv;
  const band = surv == null ? "" : surv >= .66 ? "hi" : surv >= .33 ? "mid" : "lo";
  const showSurv = V.nxt != null && surv != null && !opts.hideSurv;
  const edge = p._edge;
