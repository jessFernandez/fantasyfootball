  const sortIsVorp = S.ui.sort === "vorp" && p._vorp != null;
  const rightNum = sortIsVorp
    ? `<div class="val ${p._vorp > 0 ? "up" : "down"}">${p._vorp > 0 ? "+" : ""}${p._vorp}</div>`
    : (edge != null
        ? `<div class="val ${edge >= 4 ? "up" : "down"}" title="${
             `You have him ${p.pos}${p.pr}; the room drafts him as ${p.pos}${p.apr}` +
             (edge > 0 ? ` — ${edge} spots of cushion, you can wait`
              : edge < 0 ? ` — gone ${-edge} spots before your list wants him`
              : ` — your list and the market agree`)
           }">${edge > 0 ? "+" : ""}${edge}</div>`
        : "");

  return `
  <button class="row ${q ? "queued" : ""}"${(() => {
      const t = noteTally(p.id);
      if (t.target && t.avoid) return ` data-note="split"`;
      if (t.avoid)  return ` data-note="avoid"`;
      if (t.target) return ` data-note="target"`;
      if (t.watch)  return ` data-note="watch"`;
      return "";
    })()} data-pid="${p.id}" style="${posVar(p.pos)}">
    <div class="rk">${p.rank}<small>${p.pos}${p.pr ?? ""}</small></div>
    <div class="pos">${esc(p.pos)}</div>
    <div class="who">
      <div class="nm">${esc(p.name)}</div>
      <div class="meta">
        <span>${esc(p.team)}</span>
        ${p.bye ? `<span class="sep">·</span><span>BYE ${p.bye}</span>` : ""}
        ${p.tier != null ? `<span class="sep">·</span><span>T${p.tier}</span>` : ""}
        ${p.adp != null ? `<span class="sep">·</span><span>ADP ${Math.round(p.adp)}</span>` : ""}
        ${p.spread != null && p.spread >= 15
          ? `<span class="sep">·</span><span style="color:var(--warn)" title="Your lists disagree by ${p.spread} places on this player">±${p.spread}</span>` : ""}
        ${p.nIn != null && p.nIn < S.sources.length
          ? `<span class="sep">·</span><span title="Appears on only some of your lists">${p.nIn}/${S.sources.length}</span>` : ""}
        ${(() => {
          const st = statusOf(p.id);
          if (!st) return "";
          return `<span class="sep">&middot;</span><span class="stag" style="color:var(--${
            STATUS[st].tone});border-color:var(--${STATUS[st].tone})"
            title="${STATUS[st].word}">${st}</span>`;
        })()}
        ${(() => {
          const lk = clubLink(p);
          if (!lk) return "";
          return `<span class="sep">&middot;</span><span class="ntag" style="color:var(--accent-text)"
            title="${lk.kind === "stack"
              ? `Stacks with ${esc(lk.with.name)} on your roster`
              : `Handcuff for ${esc(lk.with.name)} on your roster`}">${
            lk.kind === "stack" ? "&#8644;" : "&#8630;"} ${esc(lastName(lk.with.name))}</span>`;
        })()}
        ${(() => {
          const t = noteTally(p.id);
          const keys = Object.keys(t);
          if (!keys.length) return "";
          return `<span class="sep">·</span>` + keys.map(k =>
            `<span class="ntag" style="color:var(--${POLARITY[k].tone})" title="${t[k]} ${POLARITY[k].word.toLowerCase()} note${t[k]>1?"s":""} — long-press to read">${
              POLARITY[k].glyph}${t[k] > 1 ? t[k] : ""}</span>`).join("");
        })()}
      </div>
    </div>
    <div class="rt">
      ${showSurv ? `<div class="surv" data-band="${band}" title="Chance this player is still available at your next pick">
        <div class="surv-n">${Math.round(surv*100)}%</div>
        <div class="surv-bar"><div class="surv-fill" style="width:${Math.round(surv*100)}%"></div></div>
      </div>` : ""}
      ${rightNum}
      <span class="qbtn" data-q="${p.id}" aria-pressed="${q}" role="button"
            title="${q ? "Remove from queue" : "Add to queue"}">${q ? "★" : "☆"}</span>
    </div>
  </button>`;
}

function renderBoard() {
  const el = document.getElementById("board");
  const V = view();

  if (!S.players.length) {
    el.innerHTML = `<div class="empty">No rankings loaded.<br><br>
      <button class="btn btn-primary" data-goto="setup">Import your rankings</button></div>`;
    return;
  }

  let list = V.avail;
  if (S.ui.filter === "QUEUE") list = list.filter(p => S.queue.includes(p.id));
  else if (S.ui.filter === "TARGET") list = list.filter(p => noteTally(p.id).target);
  else if (S.ui.filter === "AVOID")  list = list.filter(p => noteTally(p.id).avoid);
  else if (S.ui.filter !== "ALL") list = list.filter(p => p.pos === S.ui.filter);

  /* Match on a punctuation-free form, and again with spaces removed. Typed at
     speed, "jamarr" has to find Ja'Marr Chase and "smithnjigba" has to find
     Jaxon Smith-Njigba - the raw string does neither. */
  const flat = t => t.toLowerCase().normalize("NFD")
    .replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
  const q = flat(S.ui.q);
  if (q) {
    const qs = q.replace(/ /g, "");
    list = list.filter(p => {
      if (!p._sk) {
        p._sk = flat(p.name + " " + p.team + " " + p.pos);
        p._sq = p._sk.replace(/ /g, "");
      }
      return p._sk.includes(q) || p._sq.includes(qs);
    });
  }

  /* Order by one key. Unknown values always sink to the bottom whichever way
     the sort runs, and ties break on your rank so the board never reshuffles
     under you between renders. Sentinels like `?? Infinity` looked equivalent
     but compare two unknowns as Infinity - Infinity = NaN, which silently
     voids the comparator's contract for that pair. */
  const by = (key, desc) => (a, b) => {
    const x = key(a), y = key(b);
    if (x == null && y == null) return a.rank - b.rank;
    if (x == null) return 1;
    if (y == null) return -1;
    return (desc ? y - x : x - y) || (a.rank - b.rank);
  };
  const sorters = {
    rank:  (a,b) => a.rank - b.rank,
    adp:   by(p => p.adp,        false),
    value: by(p => p._edgeScore, true),
    surv:  by(p => p._surv,      false),
    vorp:  by(p => p._vorp,      true),
  };
  list = [...list].sort(sorters[S.ui.sort] || sorters.rank);

  if (!list.length) {
    el.innerHTML = `<div class="empty">
      ${q ? "No player matches &ldquo;" + esc(S.ui.q) + "&rdquo;." : "Nothing left here."}
      ${q ? `<br><br><button class="btn" id="offBoardBtn">Log a pick for someone not on my board</button>` : ""}
    </div>`;
    return;
  }

  const cap = 240;
  const shown = list.slice(0, cap);

  /* Tiers are per position, so a rule only means something on a list that is
     one position, in rank order, and unsearched. On a mixed board "tier 3"
     would be three unrelated groups sharing a number. */
  const showTiers = S.ui.sort === "rank" && !q && POS.includes(S.ui.filter);
  let html = "", lastTier = null;
  shown.forEach(p => {
    if (showTiers && p.tier != null && p.tier !== lastTier) {
      lastTier = p.tier;
      const left = list.filter(x => x.tier === p.tier).length;
      html += `<div class="tierbreak"><span class="eyebrow">Tier ${p.tier}</span>
               <span class="ln"></span><span class="eyebrow">${left} left</span></div>`;
    }
    html += playerRow(p, V);
  });
  if (list.length > cap) html += `<div class="empty">${list.length - cap} more not shown.
    Filter by position or search to reach them.</div>`;
  el.innerHTML = html;
}

function renderSide() {
  const el = document.getElementById("side");
  if (!S.players.length) { el.innerHTML = ""; return; }
  const V = view();
  const until = picksUntilMine();

  // --- scarcity: how deep is the current tier at each position ---
  const scar = POS.slice(0,4).map(pos => {
    const t = V.tiers[pos];
    if (!t) return `<div class="scar-row" style="${posVar(pos)}">
        <span class="pos">${pos}</span><div class="scar-track"></div><span class="scar-n">out</span></div>`;
    const pct = Math.min(100, (t.left / 8) * 100);
    return `<div class="scar-row" style="${posVar(pos)}">
      <span class="pos">${pos}</span>
      <div class="scar-track"><div class="scar-fill" style="width:${pct}%"></div></div>
      <span class="scar-n"><b>${t.left}</b> in T${t.tier}</span>
    </div>`;
  }).join("");

  // --- who probably won't survive to your next turn ---
  let gone = "";
  if (until != null && until > 0) {
    const risky = V.avail.filter(p => p._surv != null && p._surv < .5)
                         .sort((a,b) => a.rank - b.rank).slice(0, 6);
    gone = risky.length ? risky.map(p => `
      <div class="team-p with-val" style="${posVar(p.pos)}">
        <span class="pos">${p.pos}</span>
        <span>${esc(p.name)}</span>
        <span class="num" style="font-size:11px;color:var(--crit)">${Math.round(p._surv*100)}%</span>
      </div>`).join("")
      : `<div style="padding:4px 0;font-size:12.5px;color:var(--ink-3)">Everyone near the top of your board is likely to last.</div>`;
  }

  const costs = waitCosts();
  const waitCard = costs.length ? `
    <div class="card">
      <div class="card-h"><span class="eyebrow">Cost of waiting</span>
        <span class="eyebrow">to pick ${V.nxt}</span></div>
      <div class="card-b">
        <div class="pbars">${(() => {
          const max = Math.max(1, ...costs.map(c => Math.abs(c.drop)));
          return costs.map(c => `<div class="pbar-row" style="${posVar(c.pos)}">
            <span class="pos">${c.pos}</span>
            <div class="scar-track"><div class="scar-fill"
              style="width:${Math.round(Math.max(0, c.drop) / max * 100)}%"></div></div>
            <span class="pbar-n">${c.drop > 0 ? "&minus;" + c.drop : "0"}</span>
          </div>`).join("");
        })()}</div>
        <div class="hint" style="margin-top:8px">Points you give up at each position by
          waiting one turn. Big number, take it now.</div>
      </div>
    </div>` : "";

  const run = runInfo();
  const runStrip = run.last.length ? `<div class="runs">${
    run.last.map(p => `<div class="run-cell" style="${posVar(p.pos)}">${p.pos}</div>`).join("")
  }</div>` : `<div style="font-size:12.5px;color:var(--ink-3)">No picks yet.</div>`;

  el.innerHTML = `
    ${waitCard}
    <div class="card">
      <div class="card-h"><span class="eyebrow">Tier depth</span>
        <span class="eyebrow">${V.avail.length} available</span></div>
      <div class="card-b"><div class="scar">${scar}</div></div>
    </div>
    ${until != null && until > 0 ? `
    <div class="card">
      <div class="card-h"><span class="eyebrow">Likely gone in ${until}</span></div>
      <div class="card-b flush" style="padding:7px 0">${gone}</div>
    </div>` : ""}
    <div class="card">
      <div class="card-h"><span class="eyebrow">Last ${run.window} picks</span>
        ${run.hot ? `<span class="chip chip-warn"><span class="dot"></span>${run.hot.pos} run</span>` : ""}</div>
      <div class="card-b">${runStrip}</div>
    </div>`;
}

function renderTeam() {
  const el = document.getElementById("teamView");
  const me = S.cfg.mySlot - 1;
  const list = rosterOf(me);
  const rows = fillSlots(list);
  const proj = hasProj();
  const mine = teamPoints(me);
  const { avg } = leagueAverages();
  const val = valueCaptured(me);
  const byes = byeLoad(me);
  const V = view();

  if (!list.length) {
    el.innerHTML = `<div class="empty">Nothing drafted yet.<br>
      Your roster, projections and league comparison appear here as you pick.</div>`;
    return;
  }

  /* ---------- headline numbers ---------- */
  const dTotal = Math.round(mine.total - avg.total);
  const tiles = [];
  if (proj) {
    const ranked = [...Array(S.cfg.teams).keys()]
      .map(i => ({ i, t: teamPoints(i).total })).sort((a, b) => b.t - a.t);
    const place = ranked.findIndex(x => x.i === me) + 1;
    const suffix = n => (n % 100 >= 11 && n % 100 <= 13) ? "th"
      : ["th", "st", "nd", "rd"][n % 10] || "th";
    const behind = Math.round(ranked[0].t - mine.total);
    tiles.push(`<div class="tile">
      <div class="tile-n">${Math.round(mine.total).toLocaleString()}</div>
      <div class="tile-l">Projected starters</div>
      <div class="tile-c ${dTotal >= 0 ? "up" : "down"}">${dTotal >= 0 ? "+" : ""}${dTotal.toLocaleString()} vs league average</div>
    </div>`);
    tiles.push(`<div class="tile">
      <div class="tile-n">${place}<span style="font-size:15px">${suffix(place)}</span></div>
      <div class="tile-l">of ${S.cfg.teams} on points</div>
      <div class="tile-c">${behind === 0 ? "leading the room" : behind.toLocaleString() + " behind the leader"}</div>
    </div>`);
  }
  tiles.push(`<div class="tile">
    <div class="tile-n">${val.spots >= 0 ? "+" : ""}${val.spots}</div>
    <div class="tile-l">Picks of value</div>
    <div class="tile-c ${val.spots >= 0 ? "up" : "down"}">${val.spots >= 0
      ? "taken later than ADP on balance" : "reached, on balance"}</div>
  </div>`);
  tiles.push(`<div class="tile">
    <div class="tile-n sm">${byes.worst ? "Week " + byes.worst.week : "None"}</div>
    <div class="tile-l">Worst bye</div>
    <div class="tile-c ${byes.worst && byes.worst.n >= 3 ? "down" : ""}">${byes.worst
      ? byes.worst.n + " starter" + (byes.worst.n > 1 ? "s" : "") + " out"
      : "no starter clashes yet"}</div>
  </div>`);

  /* ---------- roster, each starter's share of the points ---------- */
  const projRows = rows.filter(r => r.p && r.p.proj != null).map(r => r.p.proj);
  const bestPts = projRows.length ? Math.max.apply(null, projRows) : 1;
  const slotHtml = rows.map(r => {
    if (!r.p) return `<div class="slot open">
        <span class="slot-lab">${r.lab}</span>
        <span class="slot-nm">empty</span><span></span></div>`;
    const clash = r.p.bye && (byes.weeks[r.p.bye] || []).length > 1 && r.lab !== "BN";
    const pts = r.p.proj;
    const showBar = proj && pts != null;
    return `<div class="slot filled" style="${posVar(r.p.pos)}">
      <span class="slot-lab">${r.lab}</span>
      <span class="slot-mid">
        <span class="slot-nm">${esc(r.p.name)}
          <span class="num" style="color:var(--ink-3);font-size:11px">${esc(r.p.team)}</span></span>
        ${showBar ? `<span class="slot-bar"><i style="width:${Math.round(pts / bestPts * 100)}%"></i></span>` : ""}
      </span>
      <span style="text-align:right">
        ${showBar ? `<span class="slot-pts">${Math.round(pts)}</span><br>` : ""}
        <span class="slot-bye ${clash ? "clash" : ""}">${r.p.bye ? "BYE " + r.p.bye : ""}</span>
      </span>
    </div>`;
  }).join("");

  /* ---------- positional strength ---------- */
  let strength = "";
  if (proj) {
    // Every position with a starting slot, so the bars add up to the headline
    // number above. Charting only the skill spots left K and DST unaccounted
    // for and the two figures silently disagreed.
    const deltas = POS.filter(pos => (S.cfg.slots[pos] || 0) > 0)
      .map(pos => ({ pos, d: (mine.byPos[pos] || 0) - (avg.byPos[pos] || 0) }));
    const max = Math.max(20, ...deltas.map(x => Math.abs(x.d)));
    strength = `
      <div class="card">
        <div class="card-h"><span class="eyebrow">Strength by position</span>
          <span class="eyebrow" style="color:var(--${dTotal >= 0 ? "good" : "crit"})">${
            dTotal >= 0 ? "+" : ""}${dTotal} overall</span></div>
        <div class="card-b">
          <div class="pbars">${deltas.map(x => {
            const w = Math.abs(x.d) / max * 48;
            const style = x.d >= 0 ? `left:50%;width:${w}%` : `left:${50 - w}%;width:${w}%`;
            return `<div class="pbar-row" style="${posVar(x.pos)}">
              <span class="pos">${x.pos}</span>
              <div class="pbar-track"><div class="pbar-fill" style="${style}"></div></div>
              <span class="pbar-n ${x.d >= 0 ? "up" : "down"}">${x.d >= 0 ? "+" : ""}${Math.round(x.d)}</span>
            </div>`;
          }).join("")}</div>
          <div class="pbar-scale"><span>behind</span><span>ahead</span></div>
        </div>
      </div>`;
  } else {
    strength = `<div class="banner banner-info"><span class="ic">&#9671;</span>
      <span>Points-based stats need a projected-points column in your rankings.
      Value and bye stats work from ADP alone, so those are still live.</span></div>`;
  }

  /* ---------- bye weeks as columns ---------- */
  const used = Object.keys(byes.weeks).map(Number);
  const lo = Math.min(5, ...(used.length ? used : [5]));
  const hi = Math.max(14, ...(used.length ? used : [14]));
  const span = [];
  for (let w = lo; w <= hi; w++) span.push(w);
  // Height is severity, not a relative share: 4 starters out is a full column,
  // so a single bye reads as the minor thing it is.
  const FULL_COLUMN = 4;
  const byeCols = span.map(w => {
    const out = byes.weeks[w] || [];
    return `<div class="byecol ${out.length >= 3 ? "hot" : ""} ${out.length ? "" : "empty-col"}">
      <span class="byecol-n">${out.length || "\u00b7"}</span>
      <div class="byecol-track" title="${out.length
        ? esc(out.map(p => p.name).join(", ")) : "no starters on bye"}">
        ${out.map(p => `<div class="byecol-seg" style="${posVar(p.pos)};height:${100 / Math.max(FULL_COLUMN, out.length)}%"></div>`).join("")}
      </div>
      <span class="byecol-w">${w}</span>
    </div>`;
  }).join("");

  /* ---------- the shape of your draft ---------- */
  const shape = S.picks.filter(pk => pk.team === me).map(pk => {
    const p = S.players.find(x => x.id === pk.pid);
    if (!p) return "";
    return `<div class="shape-pick" style="${posVar(p.pos)}" title="${esc(p.name)} &mdash; round ${roundOf(pk.overall)}, pick ${pk.overall}">
      <span class="shape-chip">${p.pos}</span>
      <span class="shape-r">R${roundOf(pk.overall)}</span>
    </div>`;
  }).join("");

  /* ---------- what's still open, and who's there now ---------- */
  const needs = openNeeds(me);
  const needHtml = needs.map(lab => {
    const want = lab === "FLEX" ? ["RB", "WR", "TE"] : [lab];
    const best = V.avail.filter(p => want.includes(p.pos)).sort((a, b) => a.rank - b.rank)[0];
    if (!best) return "";
    return `<div class="team-p with-val" style="${posVar(best.pos)}">
      <span class="pos">${lab}</span>
      <span>${esc(best.name)}</span>
      <span class="num" style="font-size:11px;color:var(--ink-3)">${best.pos}${best.pr}</span>
    </div>`;
  }).join("");

  const nextPick = myNextPick(currentPick());

  el.innerHTML = `
    <div class="tiles">${tiles.join("")}</div>

    <div class="card">
      <div class="card-h">
        <span class="eyebrow">Your roster &middot; slot ${S.cfg.mySlot}</span>
        <span class="eyebrow">${list.length} / ${S.cfg.rounds} picks</span>
      </div>
      <div class="card-b flush"><div class="slots">${slotHtml}</div></div>
    </div>

    ${strength}

    ${needHtml ? `<div class="card">
      <div class="card-h"><span class="eyebrow">Still to fill</span>
        <span class="eyebrow">best available now</span></div>
      <div class="card-b flush" style="padding:7px 0">${needHtml}</div>
    </div>` : ""}

    <div class="card">
      <div class="card-h"><span class="eyebrow">Starters on bye, by week</span>
        <span class="eyebrow">${byes.worst && byes.worst.n >= 3 ? "3+ is a problem week" : "bar colour is position"}</span></div>
      <div class="card-b"><div class="byecols">${byeCols}</div></div>
    </div>

    ${shape ? `<div class="card">
      <div class="card-h"><span class="eyebrow">How you drafted</span>
        <span class="eyebrow">in order</span></div>
      <div class="card-b"><div class="shape">${shape}</div></div>
    </div>` : ""}

    <div class="card">
      <div class="card-h"><span class="eyebrow">Your remaining picks</span></div>
      <div class="card-b">
        <div class="byes">${(() => {
          const out = []; let o = nextPick;
          while (o != null && out.length < 12) { out.push(o); o = myNextPick(o + 1); }
          return out.length
            ? out.map(o => `<span class="bye">R${roundOf(o)} &middot; #${o}</span>`).join("")
            : `<span style="font-size:12.5px;color:var(--ink-3)">No picks remaining.</span>`;
        })()}</div>
      </div>
    </div>`;
}

function renderLeague() {
  const el = document.getElementById("leagueView");
  const cards = [];
  for (let i = 0; i < S.cfg.teams; i++) {
    const list = rosterOf(i).sort((a,b) => a.rank - b.rank);
    const needs = openNeeds(i);
    cards.push(`
      <div class="team ${i === S.cfg.mySlot - 1 ? "me" : ""}">
        <div class="team-h">
          <span class="team-n">${esc(teamName(i))}${i === S.cfg.mySlot - 1 ? " <span class='eyebrow'>you</span>" : ""}</span>
          <span class="team-need">${needs.slice(0,3).map(n =>
            `<span class="need-tag" style="${posVar(n)}">${n}</span>`).join("")}</span>
        </div>
        <div class="team-list">${
          list.length ? list.map(p => `<div class="team-p" style="${posVar(p.pos)}">
            <span class="pos">${p.pos}</span><span>${esc(p.name)}</span></div>`).join("")
          : `<div class="team-p"><span></span><span style="color:var(--ink-3)">—</span></div>`
        }</div>
      </div>`);
  }
  el.innerHTML = `<div class="teams">${cards.join("")}</div>`;
}

function renderLog() {
  const el = document.getElementById("logView");
  if (!S.picks.length) {
    el.innerHTML = `<div class="empty">No picks recorded yet.<br>Tap a player on the board to log the pick.</div>`;
    return;
  }
  const rows = [...S.picks].reverse().map(pk => {
    const p = S.players.find(x => x.id === pk.pid);
    if (!p) return "";
    const mine = pk.team === S.cfg.mySlot - 1;
    return `<div class="log-row ${mine ? "mine" : ""}" style="${posVar(p.pos)}">
      <span class="log-pk">R${roundOf(pk.overall)}·${String(slotInRound(pk.overall)).padStart(2,"0")}</span>
      <span class="pos" ${p.off ? 'style="background:var(--surface-3);color:var(--ink-3)"' : ""}>${p.pos}</span>
      <span>
        <div class="slot-nm">${esc(p.name)}${p.off
          ? ` <span class="ntag" style="color:var(--ink-3)" title="Logged by hand — not in any of your ranking files">off board</span>` : ""}</div>
        <div class="log-team">${esc(teamName(pk.team))}</div>
      </span>
      <button class="xbtn" data-del="${pk.overall}" title="Delete this pick">✕</button>
    </div>`;
  }).join("");
  el.innerHTML = `
    <div class="banner banner-info"><span class="ic">↺</span>
      <span>Deleting a pick re-numbers everything after it and reassigns each to the right team.
      Use it when a pick was logged wrong, not to undo the last one — that's the Undo button.</span></div>
    <div class="btnrow" style="margin-bottom:12px">
      <button class="btn" id="offBoardBtn2">Log a pick for someone not on my board</button>
    </div>
    <div class="card"><div class="card-b flush">${rows}</div></div>`;
}

      <span><b>Your setup does not travel with the file.</b>Rankings, article picks and settings
      live in <em>this</em> browser on <em>this</em> device. To move a setup from a computer to
      the tablet, save a backup file here and load it there.</span></div>
    <div class="field">
      <label for="loadBackup">Load a backup file</label>
      <input class="inp" type="file" id="loadBackup">
      <span class="hint">Pick the <b>draft-kit-….json</b> you saved. Replaces everything currently
        loaded — rankings, notes, settings and picks.</span>
    </div>
    <div class="btnrow">
      <button class="btn btn-primary" id="saveBackup">Save a backup file</button>
      <button class="btn" id="exportState">Copy backup to clipboard</button>
      <button class="btn" id="importState">Paste backup from clipboard</button>
    </div>
    <span class="hint">The file carries your ranking sets, article picks, league settings and
      picks so far. Keep one on the tablet — if browser storage is ever cleared, loading it puts
      everything back in a few seconds.</span>

    <h2 class="sec">Start over</h2>
    <div class="btnrow">
      <button class="btn btn-danger" id="resetPicks">Clear all picks</button>
      <button class="btn btn-danger" id="resetAll">Reset everything</button>
    </div>
    <div class="foot">
      Your draft saves to this browser after every pick, so a crash or a closed tab won't lose it —
      but browser storage can still be cleared, so save a backup file once your board is set up.
      This page runs entirely offline: save it to the tablet
      (browser menu &rarr; <b>Download page</b>), open it from Downloads, and it needs no signal at all.
    </div>`;

  wireSetup();
  renderScan();
  if (pendingRows) showMapper(pendingRows);   // survive a re-render mid-import
}

/* ---------------- column mapping UI ---------------- */
let pendingRows = null, pendingMap = null, pendingName = "";
let pendingNoteText = "", pendingNoteSource = "", pendingPol = "target", pendingScan = null;
let pendingHurt = "O";

function showMapper(rows) {
  // Re-entrant: a re-render calls this again, so keep any choices already made.
  if (pendingRows !== rows || !pendingMap) pendingMap = guessMap(rows[0]);
  pendingRows = rows;
  const header = rows[0];
  const opts = i => header.map((h, j) =>
    `<option value="${j}" ${i === j ? "selected" : ""}>${esc(h || "column " + (j+1))}</option>`).join("");
  const fields = [
    ["name","Player",   true],
    ["pos","Position",  true],
    ["team","Team",     false],
    ["rank","Rank",     false],
    ["tier","Tier",     false],
    ["adp","ADP",       false],
    ["bye","Bye",       false],
    ["proj","Points",   false],
  ];
  document.getElementById("mapArea").innerHTML = `
    <div class="card" style="margin-top:12px">
      <div class="card-h"><span class="eyebrow">Match the columns</span>
        <span class="eyebrow">${rows.length - 1} rows</span></div>
      <div class="card-b">
        <div class="maprow">
          <label for="mapName">Name</label>
          <input class="inp" id="mapName" value="${esc(pendingName)}" placeholder="e.g. RotoBaller PPR">
        </div>
        ${fields.map(([f, lab, req]) => `
          <div class="maprow">
            <label for="map-${f}">${lab}${req ? " *" : ""}</label>
            <select class="sel" id="map-${f}" data-map="${f}">
              <option value="-1">— none —</option>${opts(pendingMap[f])}
            </select>
          </div>`).join("")}
        <div class="btnrow" style="margin-top:11px">
          <button class="btn btn-primary" id="confirmMap">Use these rankings</button>
          <button class="btn" id="cancelMap">Cancel</button>
        </div>
        <div class="hint" style="margin-top:8px">
          Rank falls back to row order and ADP falls back to rank, so a bare name-and-position
          list still works — you just lose the survival odds until ADP is present.
        </div>
      </div>
    </div>`;

  document.querySelectorAll("[data-map]").forEach(sel =>
    sel.addEventListener("change", e => { pendingMap[e.target.dataset.map] = parseInt(e.target.value, 10); }));

  document.getElementById("confirmMap").addEventListener("click", () => {
    if (pendingMap.name < 0) { toast("Pick which column holds the player name."); return; }
    const players = buildPlayers(pendingRows, pendingMap);
    if (!players.length) { toast("No usable rows found in that file."); return; }
    const nm = (document.getElementById("mapName")?.value || pendingName || "").trim();
    // The sample board is scaffolding; a real list replaces it rather than
    // averaging with it. Real lists accumulate.
    if (S.isDemo) S.sources = [];
    addSource(nm, players);
    const withProj = players.filter(x => x.proj != null).length;
    const withAdp  = players.filter(x => x.adp  != null).length;
    pendingRows = pendingMap = null; pendingName = "";
    S.ui.tab = "board";
    commit();
    const fit = fitScoring(players);
    toast(`${nm || "List"}: ${players.length} players`
      + (fit ? ` · looks like ${describeFit(fit)}` : ` · ${withAdp} with ADP, ${withProj} with points`));
  });
  document.getElementById("cancelMap").addEventListener("click", () => {
    pendingRows = pendingMap = null;
    document.getElementById("mapArea").innerHTML = "";
  });
}

function commitPendingNotes() {
  if (!pendingScan) return;
  const picked = [...document.querySelectorAll("[data-hit]:checked")].map(x => x.dataset.hit);
  if (!picked.length) { toast("Tick at least one player."); return; }
  const box = document.getElementById("noteSource");
  const src = ((box && box.value) || pendingNoteSource || "").trim() || "Unnamed source";
  const all = [...pendingScan.sure, ...pendingScan.maybe];
  let added = 0;
  picked.forEach(pid => {
    // one verdict per source per player - re-adding updates rather than piles up
    if (S.notes.some(n => n.pid === pid && n.source === src && n.pol === pendingPol)) return;
    const m = all.find(x => x.pid === pid);
    S.notes.push({ pid, pol: pendingPol, source: src, snippet: m ? m.snippet : "",
                   name: m ? m.name : "", pos: m ? m.pos : "" });
    if (pendingPol === "hurt") setStatus(pid, pendingHurt);
    added++;
  });
  pendingScan = null; pendingNoteText = ""; pendingNoteSource = src;
  commit();
  toast(`${added} ${POLARITY[pendingPol].word.toLowerCase()} note${added === 1 ? "" : "s"} added from ${src}.`);
}

function renderScan() {
  const el = document.getElementById("scanArea");
  if (!el) return;
  if (!pendingScan) { el.innerHTML = ""; return; }
  const { sure, maybe } = pendingScan;
  const total = sure.length + maybe.length;
  if (!total) {
    el.innerHTML = `<div class="banner banner-info" style="margin-top:12px"><span class="ic">∅</span>
      <span>No players from your board appear in that text. If the article uses nicknames or
      first names only, paste a list of the full names instead.</span></div>`;
    return;
  }
  const row = (m, checked) => `<label class="scanrow">
      <input type="checkbox" data-hit="${esc(m.pid)}" ${checked ? "checked" : ""}>
      <span class="pos" style="${posVar(m.pos)}">${m.pos}</span>
      <span style="min-width:0">
        <span class="scan-nm">${esc(m.name)} <span class="num" style="font-size:11px;color:var(--ink-3)">${esc(m.team)}</span></span>
        <span class="scan-cx">${esc(m.snippet)}</span>
      </span>
    </label>`;
  el.innerHTML = `
    <div class="card" style="margin-top:12px">
      <div class="scanhead">
        <span class="eyebrow">Found ${total}</span>
        <span class="eyebrow">${POLARITY[pendingPol].glyph} ${POLARITY[pendingPol].word}</span>
      </div>
      ${sure.length ? `<div class="card-b flush">${sure.map(m => row(m, true)).join("")}</div>` : ""}
      ${maybe.length ? `
        <div class="scanhead" style="border-top:1px solid var(--line)">
          <span class="eyebrow">Matched on surname only — check these</span>
        </div>
        <div class="card-b flush">${maybe.map(m => row(m, false)).join("")}</div>` : ""}
      <div class="card-b">
        <div class="btnrow">
          <button class="btn btn-primary" id="addNotes">Add to board</button>
          <button class="btn" id="cancelScan">Cancel</button>
        </div>
      </div>
    </div>`;
}

function wireSetup() {
  const on = (id, ev, fn) => { const e = document.getElementById(id); if (e) e.addEventListener(ev, fn); };

  on("csvFile", "change", e => {
    const f = e.target.files[0];
    if (!f) return;
    pendingName = f.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").slice(0, 40);
    const r = new FileReader();
    r.onload = () => {
      const rows = parseCSV(String(r.result));
      if (rows.length < 2) { toast("That file has no data rows."); return; }
      showMapper(rows);
    };
    r.onerror = () => toast("Couldn't read that file.");
    r.readAsText(f);
  });

  on("importText", "click", () => {
    if (!pendingName) pendingName = `List ${S.sources.length + 1}`;
    const t = document.getElementById("csvText").value;
    if (!t.trim()) { toast("Paste your CSV into the box first."); return; }
    const rows = parseCSV(t);
    if (rows.length < 2) { toast("That doesn't look like a CSV with a header row."); return; }
    showMapper(rows);
  });

  on("loadDemo", "click", () => { loadDemo(); toast("Sample board reloaded."); });

  // --- article picks ---
  on("noteText", "input", e => { pendingNoteText = e.target.value; });
  on("noteSource", "input", e => { pendingNoteSource = e.target.value; });
  document.querySelectorAll("[data-hurtcode]").forEach(b =>
    b.addEventListener("click", () => {
      pendingHurt = b.dataset.hurtcode;
      document.querySelectorAll("[data-hurtcode]").forEach(x =>
        x.setAttribute("aria-pressed", String(x.dataset.hurtcode === pendingHurt)));
    }));

  document.querySelectorAll("[data-pol]").forEach(b =>
    b.addEventListener("click", () => {
      pendingPol = b.dataset.pol;
      renderSetup();      // the injury row appears or disappears with the choice
    }));

  on("scanNotes", "click", () => {
    const txt = document.getElementById("noteText").value;
    pendingNoteText = txt;
    if (!txt.trim()) { toast("Paste the article text first."); return; }
    if (!S.players.length) { toast("Load your rankings before adding article picks."); return; }
    pendingScan = scanText(txt);
    renderScan();
    const n = pendingScan.sure.length + pendingScan.maybe.length;
    toast(n ? `Found ${n} of your players.` : "No players from your board in that text.");
  });


  on("clearNotes", "click", () => {
    if (!confirm(`Remove all ${S.notes.length} article notes? Rankings and picks are untouched.`)) return;
    S.notes = []; commit(); toast("Notes cleared.");
  });

  document.querySelectorAll("[data-dropnotes]").forEach(b =>
    b.addEventListener("click", () => {
      const raw = b.dataset.dropnotes;
      const cut = raw.lastIndexOf("|");
      const src = raw.slice(0, cut), pol = raw.slice(cut + 1);
      S.notes = S.notes.filter(n => !(n.source === src && n.pol === pol));
      S.ui.openNotes = (S.ui.openNotes || []).filter(k => k !== raw);
      commit(); toast("Removed.");
    }));

  document.querySelectorAll("[data-use]").forEach(b =>
    b.addEventListener("click", () => {
      S.activeSource = b.dataset.use;
      refreshActive();
      commit();
      toast("Using " + activeSourceName() + ".");
    }));

  document.querySelectorAll("[data-opennotes]").forEach(b =>
    b.addEventListener("click", () => {
      const key = b.dataset.opennotes;
      const open = S.ui.openNotes || (S.ui.openNotes = []);
      const at = open.indexOf(key);
      if (at >= 0) open.splice(at, 1); else open.push(key);
      save(); renderSetup();
    }));

  document.querySelectorAll("[data-dropsrc]").forEach(b =>
    b.addEventListener("click", () => {
      const src = sourceById(b.dataset.dropsrc);
      if (!src) return;
      if (!confirm(`Remove "${src.name}"? Your picks stay — only this ranking set goes.`)) return;
      removeSource(src.id);
      if (!S.sources.length) loadDemo(); else commit();
      toast("Removed.");
    }));

  const cfgNum = (id, key, min, max) => on(id, "change", e => {
    let v = parseInt(e.target.value, 10);
    if (!isFinite(v)) { e.target.value = S.cfg[key]; return; }
    v = Math.max(min, Math.min(max, v));
    if (v === S.cfg[key]) { e.target.value = v; return; }
    // Re-seating rewrites who owns picks already logged, so say so first.
    if (key === "teams" && S.picks.length &&
        !confirm(`${S.picks.length} picks are already logged. Changing the league to ${v} teams `
               + `re-assigns them to the teams a ${v}-team snake would have given. Continue?`)) {
      e.target.value = S.cfg[key];
      return;
    }
    S.cfg[key] = v;
    if (key === "teams") {
      S.cfg.mySlot = Math.min(S.cfg.mySlot, v);
      reseatPicks();
    }
    commit();
  });
  cfgNum("cfgTeams", "teams", 2, 32);
  cfgNum("cfgSlot", "mySlot", 1, S.cfg.teams);
  cfgNum("cfgRounds", "rounds", 1, 40);

  on("cfgTrr", "change", e => {
    S.cfg.trr = e.target.checked;
    reseatPicks();          // the reversal changes the order picks belong to
    commit();
  });
  on("cfgAwake", "change", e => {
    S.cfg.awake = e.target.checked;
    keepAwake(S.cfg.awake);
    save();
    toast(S.cfg.awake ? "Screen will stay awake." : "Screen may sleep.");
  });
  on("cfgRehearse", "change", e => {
    S.cfg.rehearse = e.target.checked;
    commit();
    toast(S.cfg.rehearse ? "Rehearsal on — Sim button added to the top bar." : "Rehearsal off.");
  });

  document.querySelectorAll("[data-preset]").forEach(b =>
    b.addEventListener("click", () => {
      const pre = SCORING_PRESETS.find(x => x.id === b.dataset.preset);
      if (!pre) return;
      Object.assign(S.cfg.scoring, pre.set);
      S.cfg.scoring.on = true;
      refreshActive(); commit();
      const d = scoringDelta();
      toast(d.moved.length
        ? `${pre.label}: ${d.moved.length} player${d.moved.length === 1 ? "" : "s"} rescored.`
        : `${pre.label}: matches the file, nothing changes.`);
    }));

  on("scOn", "change", e => {
    S.cfg.scoring.on = e.target.checked;
    refreshActive(); commit();
    toast(S.cfg.scoring.on ? "Using your scoring." : "Back to the file's points.");
  });
  SCORING_FIELDS.forEach(([k]) => on("sc-" + k, "change", e => {
    const v = parseFloat(e.target.value);
    if (!isFinite(v)) return;
    S.cfg.scoring[k] = v;
    refreshActive(); commit();
  }));

  ["QB","RB","WR","TE","FLEX","K","DST","BN"].forEach(k =>
    on("slot-" + k, "change", e => {
      const v = Math.max(0, Math.min(12, parseInt(e.target.value, 10) || 0));
      S.cfg.slots[k] = v; commit();
    }));

  on("cfgVol", "input", e => {
    S.cfg.vol = parseFloat(e.target.value);
    const lab = document.querySelector('label[for="cfgVol"]');
    if (lab) lab.textContent = `ADP volatility — ${S.cfg.vol.toFixed(2)}`;
    save();
    renderBoard(); renderSide();
  });

  on("cfgNames", "change", e => {
    S.cfg.names = e.target.value.split("\n").map(s => s.trim());
    commit();
  });

  on("cfgTheme", "change", e => {
    S.theme = e.target.value === "system" ? null : e.target.value;
    applyTheme(); save();
  });

  on("saveBackup", "click", () => { downloadBackup(); });

  on("loadBackup", "change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const got = applyBackup(JSON.parse(String(r.result)));
        toast(`Restored ${got.players} players from ${got.lists} list${got.lists === 1 ? "" : "s"}`
          + `, ${got.notes} note${got.notes === 1 ? "" : "s"}, ${got.picks} pick${got.picks === 1 ? "" : "s"}.`);
      } catch (err) { toast("That file isn't a Draft Room backup."); }
    };
    r.onerror = () => toast("Couldn't read that file.");
    r.readAsText(f);
  });

  on("exportState", "click", async () => {
    const txt = backupPayload();
    try { await navigator.clipboard.writeText(txt); toast("Backup copied to clipboard."); }
    catch (err) {
      const ta = document.getElementById("csvText");
      if (ta) { ta.value = txt; ta.select(); }
      toast("Clipboard blocked — the backup is in the paste box above, copy it manually.");
    }
  });

  on("importState", "click", async () => {
    try {
      const txt = await navigator.clipboard.readText();
      const got = applyBackup(JSON.parse(txt));
      toast(`Restored ${got.players} players, ${got.picks} picks.`);
    } catch (err) { toast("Clipboard didn't contain a Draft Room backup."); }
  });

  on("resetPicks", "click", () => {
    if (!S.picks.length) { toast("There are no picks to clear."); return; }
    if (confirm(`Clear all ${S.picks.length} recorded picks? Your rankings and settings stay.`)) {
      S.picks = []; commit(); toast("Picks cleared.");
    }
  });

  on("resetAll", "click", () => {
    if (confirm("Reset everything — rankings, picks and settings — back to the sample board?")) {
      const theme = S.theme;
      S = defaults(); S.theme = theme;
      loadDemo(); toast("Reset.");
    }
  });
}

function openSheet(pid) {
  const p = S.players.find(x => x.id === pid);
  if (!p) return;
  const cur = currentPick();
  const now = teamOnClock(cur);
  const btns = [];
  for (let i = 0; i < S.cfg.teams; i++) {
    btns.push(`<button class="pick-team ${i === now ? "now" : ""}" data-team="${i}">
      <span>${esc(teamName(i))}${i === S.cfg.mySlot - 1 ? " (you)" : ""}</span>
      <span class="tag">${i === now ? "ON THE CLOCK" : ""}</span>
    </button>`);
  }
  const notes = notesFor(pid);
  document.getElementById("sheet").innerHTML = `
    <div class="sheet-h">
      <div class="sheet-t">${esc(p.name)}</div>
      <div class="sheet-s">${esc(p.pos)}${p.pr ?? ""} · ${esc(p.team)}${p.bye ? " · BYE " + p.bye : ""}
        ${p.adp != null ? " · ADP " + Math.round(p.adp) : ""}
        ${p._edge != null ? ` · room has him ${p.pos}${p.apr}` : ""}</div>
    </div>
    <div class="sheet-b" style="padding-bottom:2px">
      <div class="eyebrow" style="margin-bottom:7px">Availability</div>
      <div class="filters" style="gap:5px">
        <button class="fbtn" data-status="" aria-pressed="${!statusOf(pid)}">Fit</button>
        ${STATUS_CODES.map(c => `<button class="fbtn" data-status="${c}"
          aria-pressed="${statusOf(pid) === c}"
          style="${statusOf(pid) === c ? `color:var(--${STATUS[c].tone});border-color:var(--${STATUS[c].tone})` : ""}"
          title="${STATUS[c].word}">${c}</button>`).join("")}
      </div>
    </div>
    ${notes.length ? `<div class="sheet-b" style="padding-bottom:4px">
      <div class="eyebrow" style="margin-bottom:7px">What you've read</div>
      ${notes.map((n, i) => `<div class="noterow">
        <div class="note-h">
          <span class="ntag" style="color:var(--${POLARITY[n.pol].tone})">${POLARITY[n.pol].glyph} ${POLARITY[n.pol].word}</span>
          <span class="note-src">${esc(n.source)}</span>
          <button class="xbtn" data-delnote="${esc(n.pid)}|${i}" title="Remove this note">✕</button>
        </div>
        ${n.snippet ? `<div class="note-snip">${esc(n.snippet)}</div>` : ""}
      </div>`).join("")}
    </div>` : ""}
    <div class="sheet-b">
      <div class="eyebrow" style="margin-bottom:7px">Drafted by</div>
      ${btns.join("")}
      <button class="btn" id="sheetCancel" style="width:100%;margin-top:9px">Cancel</button>
    </div>`;
  document.getElementById("scrim").classList.add("on");
  document.getElementById("sheet").dataset.pid = pid;
}
function closeSheet() { document.getElementById("scrim").classList.remove("on"); }

  S.ui.sort = e.target.value; save(); renderBoard();
});

// VORP needs a projected-points column; say so rather than sorting by nothing.
function syncSortOptions() {
  const set = (val, ok, on, off) => {
    const opt = document.querySelector(`#sort option[value="${val}"]`);
    if (!opt) return;
    opt.disabled = !ok;
    opt.textContent = ok ? on : off;
    if (!ok && S.ui.sort === val) {
      S.ui.sort = "rank";
      document.getElementById("sort").value = "rank";
    }
  };
  set("vorp", hasProj(),
      "Value over replacement", "Value over replacement (needs a points column)");
  set("value", S.players.some(p => p.adpReal),
      "My rank vs ADP", "My rank vs ADP (needs an ADP column)");
}

// One tap on the board = that player goes to whoever is on the clock.
// Long-press (or the star) does something else.
let pressT = null, pressed = false;
document.getElementById("board").addEventListener("pointerdown", e => {
  const row = e.target.closest(".row");
  if (!row || e.target.closest("[data-q]")) return;
  pressed = false;
  pressT = setTimeout(() => { pressed = true; openSheet(row.dataset.pid); }, 480);
});
const clearPress = () => { clearTimeout(pressT); };
["pointerup","pointercancel","pointerleave"].forEach(ev =>
  document.getElementById("board").addEventListener(ev, clearPress));
// Scrolling the board is a drag, not a long-press.
document.getElementById("board").addEventListener("pointermove", e => {
  if (pressT && (Math.abs(e.movementX) > 3 || Math.abs(e.movementY) > 3)) clearPress();
}, { passive: true });

document.getElementById("board").addEventListener("click", e => {
  if (e.target.closest("#offBoardBtn")) { openOffBoardSheet(); return; }
  const goto = e.target.closest("[data-goto]");
  if (goto) { S.ui.tab = goto.dataset.goto; save(); render(); return; }
  const star = e.target.closest("[data-q]");
  if (star) { toggleQueue(star.dataset.q); return; }
  const row = e.target.closest(".row");
  if (!row) return;
  if (pressed) { pressed = false; return; }   // long-press already handled it
  draftPlayer(row.dataset.pid);
  if (S.ui.q) { searchEl.value = ""; S.ui.q = ""; renderBoard(); }
});

document.getElementById("pane-setup").addEventListener("click", e => {
  if (e.target.closest("#addNotes"))   { commitPendingNotes(); return; }
  if (e.target.closest("#cancelScan")) { pendingScan = null; renderScan(); return; }
});

document.getElementById("logView").addEventListener("click", e => {
  if (e.target.closest("#offBoardBtn2")) { openOffBoardSheet(); return; }
  const del = e.target.closest("[data-del]");
  if (!del) return;
  removePick(parseInt(del.dataset.del, 10));
});

document.getElementById("scrim").addEventListener("click", e => {
  const del = e.target.closest("[data-delnote]");
  if (del) {
    const at = del.dataset.delnote.lastIndexOf("|");
    const pid = del.dataset.delnote.slice(0, at);
    const idx = parseInt(del.dataset.delnote.slice(at + 1), 10);
    const mine = notesFor(pid);
    if (mine[idx]) S.notes.splice(S.notes.indexOf(mine[idx]), 1);
    commit();
    openSheet(pid);          // keep the sheet open on the player you were reading
    return;
  }
  const st = e.target.closest("button[data-status]");
  if (st) {
    const pid = document.getElementById("sheet").dataset.pid;
    if (pid) {
      setStatus(pid, st.dataset.status);
      commit();
      openSheet(pid);        // stay where you are, with the new flag showing
    }
    return;
  }
  const obPos = e.target.closest("button[data-obpos]");
  if (obPos) {
    offBoardPos = obPos.dataset.obpos;
    [...document.querySelectorAll("button[data-obpos]")].forEach(b =>
      b.setAttribute("aria-pressed", String(b === obPos)));
    return;
  }
  const obTeam = e.target.closest("button[data-obteam]");
  if (obTeam) {
    const nameBox = document.getElementById("obName");
    const p = addOffBoard(nameBox ? nameBox.value : "", offBoardPos, "");
    refreshActive();
    draftPlayer(p.id, parseInt(obTeam.dataset.obteam, 10));
    closeSheet();
    toast(`Logged ${esc(p.name)} to ${teamName(parseInt(obTeam.dataset.obteam, 10))}.`);
    return;
  }
  if (e.target.id === "scrim" || e.target.id === "sheetCancel") { closeSheet(); return; }
  const t = e.target.closest("[data-team]");
  if (!t) return;
  const pid = document.getElementById("sheet").dataset.pid;
  draftPlayer(pid, parseInt(t.dataset.team, 10));
  closeSheet();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "");
  if (typing) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
  if (e.key === "/") { e.preventDefault(); S.ui.tab = "board"; render(); searchEl.focus(); }
});

/* ================================================================
   BOOT
   ================================================================ */
/* A save written before ranking sets existed holds a flat players[] whose
   picks point at row ids ("p7"). Rehome it as one set and translate those
   ids to the stable player keys, so an in-progress draft isn't lost. */
function migrate() {
  if (S.sources.length || !Array.isArray(S.players) || !S.players.length) return;
  const old = S.players;
  const idMap = {};
  old.forEach((pl, i) => {
    const wasId = pl.id != null ? pl.id : "p" + i;
    idMap[wasId] = playerKey(pl.name, pl.pos, pl.team);
  });
  assignKeys(old);
  S.picks = S.picks.map(pk => ({ ...pk, pid: idMap[pk.pid] || pk.pid }));
  S.queue = S.queue.map(q => idMap[q] || q);
  S.sources = [{ id: "s_migrated", name: S.isDemo ? "Sample board" : "Imported list", players: old }];
  S.activeSource = "s_migrated";
}
migrate();
refreshActive();
if (!S.sources.length) loadDemo();
searchEl.value = S.ui.q || "";
document.getElementById("sort").value = S.ui.sort || "rank";
render();
